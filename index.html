<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baby Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f2f2f7; color: #1c1c1e; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen pb-12 select-none">

    <!-- Sync Progress Bar -->
    <div id="syncProgressBar" class="h-1 w-0 bg-rose-500 transition-all duration-300 fixed top-0 left-0 z-50"></div>

    <!-- Login Screen -->
    <div id="loginScreen" class="fixed inset-0 bg-[#f2f2f7] z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-xl border border-gray-100 space-y-5 text-center">
            <div class="w-14 h-14 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto">
                <i data-lucide="lock" class="w-7 h-7"></i>
            </div>
            <div>
                <h2 class="text-xl font-bold text-gray-900">Welcome Back</h2>
                <p class="text-xs text-gray-500 mt-1">Enter your username to access your tracker.</p>
            </div>
            <div class="space-y-3 text-left">
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Username / ID</label>
                    <input id="loginUser" type="text" placeholder="e.g. Eric" class="w-full mt-1 bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-semibold text-gray-800">
                </div>
            </div>
            <button onclick="handleLogin()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 rounded-xl shadow-sm transition active:scale-95 text-sm">
                Unlock Tracker
            </button>
        </div>
    </div>

    <!-- Main Container -->
    <div id="appContainer" class="flex-1 flex flex-col hidden">
        <!-- Top Header -->
        <header class="sticky top-0 z-30 bg-[#f2f2f7]/80 backdrop-blur-md border-b border-gray-200 px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <h1 class="text-xl font-bold tracking-tight">Baby Tracker</h1>
                <span id="syncStatus" class="w-2 h-2 rounded-full bg-amber-400" title="Syncing..."></span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openCalendarModal()" class="text-xs font-semibold text-purple-600 bg-purple-50 px-3 py-1.5 rounded-full active:scale-95 transition flex items-center gap-1">
                    <i data-lucide="calendar" class="w-3.5 h-3.5"></i> Calendar
                </button>
                <button onclick="forceSync()" class="text-xs font-semibold text-rose-600 bg-rose-50 px-3 py-1.5 rounded-full active:scale-95 transition">Sync</button>
                <button onclick="openSettings()" class="w-8 h-8 rounded-full bg-gray-200/60 flex items-center justify-center text-gray-700 active:scale-95 transition">
                    <i data-lucide="settings" class="w-4 h-4"></i>
                </button>
                <button onclick="handleLogout()" class="w-8 h-8 rounded-full bg-rose-50 text-rose-600 flex items-center justify-center active:scale-95 transition" title="Logout">
                    <i data-lucide="log-out" class="w-4 h-4"></i>
                </button>
            </div>
        </header>

        <main class="flex-1 max-w-md w-full mx-auto px-4 pt-4 space-y-4">
            <!-- Child Selector -->
            <div id="childSelector" class="flex gap-2 overflow-x-auto pb-1 no-scrollbar"></div>

            <!-- Selected Child Meta Header Card -->
            <div id="childMetaCard" class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center justify-between hidden">
                <div class="flex items-center gap-3">
                    <div id="childMetaGenderBadge" class="w-10 h-10 rounded-full flex items-center justify-center text-lg font-bold">
                        <i data-lucide="baby" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <div class="flex items-center gap-2">
                            <h2 id="childMetaName" class="text-base font-bold text-gray-900">Baby</h2>
                            <span id="childMetaGenderTag" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-gray-100 text-gray-600 uppercase">Unspecified</span>
                        </div>
                        <p id="childMetaAge" class="text-xs font-medium text-gray-500 mt-0.5">Age: Not set</p>
                    </div>
                </div>
                <button onclick="openSettings()" class="text-xs text-rose-500 font-semibold hover:underline">Edit</button>
            </div>

            <!-- Summary Dashboard Card -->
            <div id="summaryCardContainer" class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 hidden">
                <div class="flex justify-between items-center mb-3">
                    <div class="flex items-center gap-1.5 text-rose-500 font-semibold text-sm">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                        <span>Dashboard (Past 24h)</span>
                    </div>
                </div>
                <div id="summaryDashboardGrid" class="grid grid-cols-2 gap-2 text-center"></div>
            </div>

            <!-- Enhanced Action Grid with Custom Visual Icons -->
            <div id="actionGrid" class="grid grid-cols-2 gap-3"></div>

            <!-- Instant Diaper Buttons -->
            <div id="instantDiaperSection" class="space-y-1.5">
                <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider px-1">Instant Diaper Log</span>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="quickDiaper('Wet')" class="bg-blue-50 text-blue-600 font-semibold text-xs py-2.5 rounded-full flex items-center justify-center gap-1 active:scale-95 transition shadow-2xs border border-blue-100">
                        <i data-lucide="droplets" class="w-3.5 h-3.5 text-blue-500"></i> Wet
                    </button>
                    <button onclick="quickDiaper('Dirty')" class="bg-amber-50 text-amber-700 font-semibold text-xs py-2.5 rounded-full flex items-center justify-center gap-1 active:scale-95 transition shadow-2xs border border-amber-100">
                        <i data-lucide="package" class="w-3.5 h-3.5 text-amber-600"></i> Dirty
                    </button>
                    <button onclick="quickDiaper('Both')" class="bg-purple-50 text-purple-600 font-semibold text-xs py-2.5 rounded-full flex items-center justify-center gap-1 active:scale-95 transition shadow-2xs border border-purple-100">
                        <i data-lucide="sparkles" class="w-3.5 h-3.5 text-purple-500"></i> Both
                    </button>
                </div>
            </div>

            <!-- Logs Feed Header, Filter Control Panel & Mass Delete Actions -->
            <div class="space-y-3 pt-2">
                <div class="flex items-center justify-between px-1">
                    <h2 class="text-sm font-bold text-gray-800">Logs Feed</h2>
                    <div class="flex items-center gap-2">
                        <button id="toggleSelectBtn" onclick="toggleMassSelectMode()" class="text-xs font-semibold text-gray-500 bg-gray-200/60 px-2.5 py-1 rounded-full">Select</button>
                        <button id="selectAllBtn" onclick="toggleSelectAllLogs()" class="text-xs font-semibold text-blue-600 bg-blue-50 px-2.5 py-1 rounded-full hidden">Select All</button>
                        <button id="deleteSelectedBtn" onclick="deleteSelectedLogs()" class="text-xs font-semibold text-white bg-rose-500 px-2.5 py-1 rounded-full hidden">Delete Selected</button>
                    </div>
                </div>

                <!-- Log Filter Bar -->
                <div class="bg-white p-3 rounded-2xl border border-gray-100 shadow-2xs space-y-2">
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase">Type Filter</label>
                            <select id="filterType" onchange="applyFilters()" class="w-full mt-0.5 bg-gray-50 border border-gray-200 rounded-lg p-1.5 text-xs font-semibold text-gray-700">
                                <option value="all">All Types</option>
                                <option value="nursing">Nursing</option>
                                <option value="sleep">Sleep</option>
                                <option value="bottle">Bottle</option>
                                <option value="diaper">Diaper</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase">Date Filter</label>
                            <select id="filterDateRange" onchange="handleDateRangeChange()" class="w-full mt-0.5 bg-gray-50 border border-gray-200 rounded-lg p-1.5 text-xs font-semibold text-gray-700">
                                <option value="all">All Time</option>
                                <option value="today">Today</option>
                                <option value="7days">Last 7 Days</option>
                                <option value="custom">Custom Range</option>
                            </select>
                        </div>
                    </div>

                    <!-- Custom Date Input Controls (Hidden by default) -->
                    <div id="customDateContainer" class="grid grid-cols-2 gap-2 hidden pt-1 border-t border-gray-100">
                        <div>
                            <label class="text-[9px] font-bold text-gray-400 uppercase">From</label>
                            <input id="filterStartDate" type="date" onchange="applyFilters()" class="w-full mt-0.5 bg-gray-50 border border-gray-200 rounded-lg p-1.5 text-xs">
                        </div>
                        <div>
                            <label class="text-[9px] font-bold text-gray-400 uppercase">To</label>
                            <input id="filterEndDate" type="date" onchange="applyFilters()" class="w-full mt-0.5 bg-gray-50 border border-gray-200 rounded-lg p-1.5 text-xs">
                        </div>
                    </div>
                </div>

                <div id="logsContainer" class="space-y-2"></div>
            </div>
        </main>
    </div>

    <!-- Generic App Modal -->
    <div id="appModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4">
        <div id="modalBox" class="bg-[#f2f2f7] w-full max-w-md mx-auto rounded-3xl max-h-[90vh] overflow-y-auto p-5 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b border-gray-200 pb-3">
                <h3 id="modalTitle" class="font-bold text-lg text-gray-900">Log Entry</h3>
                <button onclick="closeModal()" class="text-gray-400 font-semibold text-sm">Cancel</button>
            </div>
            <div id="modalBody" class="space-y-4"></div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQXwiSr4NpYe4sV0gdrhiGmbBskpXWkAzF0Zi2riS-UxuVjqgAI1_IydbLi3PovPk/exec";

        let currentUser = localStorage.getItem('babyTrackerCurrentUser') || '';
        let state = {
            children: [{ id: '1', name: 'Baby', gender: 'unspecified', birthdate: '', showNursing: true, showBottle: true, showDiaper: true, showSleep: true }],
            selectedChildId: null,
            logs: []
        };

        let isMassSelectMode = false;
        let selectedLogIds = new Set();
        let selectedCalDate = new Date();

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            if (currentUser) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
                loadData();
            }
        });

        function updateSyncProgress(percent) {
            const bar = document.getElementById('syncProgressBar');
            bar.style.width = `${percent}%`;
            if (percent >= 100) setTimeout(() => { bar.style.width = '0%'; }, 500);
        }

        function handleLogin() {
            const usernameInput = document.getElementById('loginUser').value.trim().toLowerCase();
            if (!usernameInput) return alert("Please enter a username.");
            currentUser = usernameInput;
            localStorage.setItem('babyTrackerCurrentUser', currentUser);
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');
            loadData();
        }

        function handleLogout() {
            if (confirm("Logout of tracker?")) {
                localStorage.removeItem('babyTrackerCurrentUser');
                currentUser = '';
                document.getElementById('appContainer').classList.add('hidden');
                document.getElementById('loginScreen').classList.remove('hidden');
            }
        }

        function getStorageKey() { return `babyTrackerState_${currentUser || 'default'}`; }

        async function loadData() {
            updateSyncProgress(30);
            const localRaw = localStorage.getItem(getStorageKey());
            if (localRaw) {
                try {
                    const parsed = JSON.parse(localRaw);
                    state.children = parsed.children || state.children;
                    state.logs = parsed.logs || [];
                    state.selectedChildId = parsed.selectedChildId || null;
                } catch(e) {}
                render();
            }
            updateSyncProgress(60);

            try {
                const response = await fetch(`${SCRIPT_URL}?user=${encodeURIComponent(currentUser)}`, { cache: 'no-store' });
                const cloudData = await response.json();
                if (cloudData && Array.isArray(cloudData.logs)) {
                    state = cloudData;
                    localStorage.setItem(getStorageKey(), JSON.stringify(state));
                    render();
                }
            } catch (err) {}
            updateSyncProgress(100);
        }

        async function saveData() {
            updateSyncProgress(40);
            localStorage.setItem(getStorageKey(), JSON.stringify(state));
            render();

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ user: currentUser, data: state })
                });
            } catch (err) {}
            updateSyncProgress(100);
        }

        async function forceSync() { await loadData(); await saveData(); }

        function calculateExactAge(birthdateStr) {
            if (!birthdateStr) return "Birthdate not set";
            const birthDate = new Date(birthdateStr + 'T00:00:00');
            const today = new Date();
            if (isNaN(birthDate.getTime())) return "Invalid date";

            let years = today.getFullYear() - birthDate.getFullYear();
            let months = today.getMonth() - birthDate.getMonth();
            let days = today.getDate() - birthDate.getDate();

            if (days < 0) {
                months--;
                days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
            }
            if (months < 0) {
                years--;
                months += 12;
            }

            const parts = [];
            if (years > 0) parts.push(`${years} ${years === 1 ? 'yr' : 'yrs'}`);
            if (months > 0 || years > 0) parts.push(`${months} ${months === 1 ? 'mo' : 'mos'}`);
            parts.push(`${days} ${days === 1 ? 'day' : 'days'}`);
            return parts.join(', ');
        }

        function render() {
            renderChildSelector();
            renderChildMetaCard();
            renderSummary();
            renderActionGrid();
            renderLogs();
            lucide.createIcons();
        }

        function renderChildSelector() {
            const container = document.getElementById('childSelector');
            let html = `<button onclick="selectChild(null)" class="px-4 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap ${state.selectedChildId === null ? 'bg-rose-500 text-white' : 'bg-white text-gray-700 shadow-xs'}">All Children</button>`;
            (state.children || []).forEach(child => {
                const isSelected = state.selectedChildId === child.id;
                html += `<button onclick="selectChild('${child.id}')" class="px-4 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap ${isSelected ? 'bg-rose-500 text-white' : 'bg-white text-gray-700 shadow-xs'}">${child.name}</button>`;
            });
            container.innerHTML = html;
        }

        function selectChild(id) { state.selectedChildId = id; saveData(); }
        function getActiveChild() { return state.children.find(c => c.id === state.selectedChildId) || state.children[0]; }

        function renderChildMetaCard() {
            const container = document.getElementById('childMetaCard');
            if (state.selectedChildId === null || !state.children.length) {
                container.classList.add('hidden');
                return;
            }
            container.classList.remove('hidden');
            const child = getActiveChild();

            document.getElementById('childMetaName').innerText = child.name || 'Baby';
            document.getElementById('childMetaAge').innerText = `Age: ${calculateExactAge(child.birthdate)}`;

            const badge = document.getElementById('childMetaGenderBadge');
            const tag = document.getElementById('childMetaGenderTag');
            const gender = (child.gender || 'unspecified').toLowerCase();

            if (gender === 'boy') {
                badge.className = "w-10 h-10 rounded-full flex items-center justify-center bg-blue-100 text-blue-600 font-bold";
                tag.className = "text-[10px] font-bold px-2 py-0.5 rounded-full bg-blue-50 text-blue-600 uppercase";
                tag.innerText = "Boy";
            } else if (gender === 'girl') {
                badge.className = "w-10 h-10 rounded-full flex items-center justify-center bg-pink-100 text-pink-600 font-bold";
                tag.className = "text-[10px] font-bold px-2 py-0.5 rounded-full bg-pink-50 text-pink-600 uppercase";
                tag.innerText = "Girl";
            } else {
                badge.className = "w-10 h-10 rounded-full flex items-center justify-center bg-purple-100 text-purple-600 font-bold";
                tag.className = "text-[10px] font-bold px-2 py-0.5 rounded-full bg-gray-100 text-gray-600 uppercase";
                tag.innerText = "Unspecified";
            }
        }

        function renderSummary() {
            const logs = (state.logs || []).filter(l => !state.selectedChildId || l.childId === state.selectedChildId);
            const summaryContainer = document.getElementById('summaryCardContainer');
            if (logs.length === 0) return summaryContainer.classList.add('hidden');
            summaryContainer.classList.remove('hidden');

            const dayCutoff = Date.now() - 86400000;
            const recent = logs.filter(l => l.startTime >= dayCutoff);

            const formula = recent.filter(l => l.type === 'bottle').reduce((acc, l) => acc + (l.amount || 0), 0);
            const wet = recent.filter(l => l.type === 'diaper' && (l.diaperType === 'Wet' || l.diaperType === 'Both')).length;
            const dirty = recent.filter(l => l.type === 'diaper' && (l.diaperType === 'Dirty' || l.diaperType === 'Both')).length;
            
            let totalSleepMs = 0;
            recent.filter(l => l.type === 'sleep').forEach(l => {
                const lStart = l.startTime;
                const lEnd = l.endTime || Date.now();
                const effectiveStart = Math.max(lStart, dayCutoff);
                const effectiveEnd = Math.min(lEnd, Date.now());
                if (effectiveEnd > effectiveStart) totalSleepMs += (effectiveEnd - effectiveStart);
            });

            const grid = document.getElementById('summaryDashboardGrid');
            let html = '';

            if (formula > 0) {
                grid.className = "grid grid-cols-3 gap-2 text-center";
                html += `
                    <div class="bg-blue-50/60 rounded-xl p-2.5">
                        <i data-lucide="milk" class="w-4 h-4 text-blue-500 mx-auto mb-1"></i>
                        <div class="font-bold text-sm text-gray-800">${formula.toFixed(1)} oz</div>
                        <div class="text-[10px] text-gray-500 font-medium">Formula</div>
                    </div>
                `;
            } else {
                grid.className = "grid grid-cols-2 gap-2 text-center";
            }

            html += `
                <div class="bg-purple-50/60 rounded-xl p-2.5">
                    <i data-lucide="moon-star" class="w-4 h-4 text-purple-500 mx-auto mb-1"></i>
                    <div class="font-bold text-sm text-gray-800">${(totalSleepMs / 3600000).toFixed(1)}h</div>
                    <div class="text-[10px] text-purple-600 font-semibold">Sleep Log</div>
                </div>
                <div class="bg-orange-50/60 rounded-xl p-2.5">
                    <i data-lucide="layers" class="w-4 h-4 text-orange-400 mx-auto mb-1"></i>
                    <div class="font-bold text-sm text-gray-800">${wet}W / ${dirty}D</div>
                    <div class="text-[10px] text-gray-500 font-medium">Diapers</div>
                </div>
            `;
            grid.innerHTML = html;
        }

        // --- Render Action Grid with Enhanced Visual Icons ---
        function renderActionGrid() {
            const child = getActiveChild();
            const grid = document.getElementById('actionGrid');
            if(!child) return;

            let html = '';
            if(child.showNursing !== false) {
                html += `
                    <button onclick="openNursingTimer()" class="bg-gradient-to-b from-rose-50/50 to-white p-4 rounded-2xl shadow-sm border border-rose-100 flex flex-col items-center justify-center gap-2.5 active:scale-95 transition">
                        <div class="w-12 h-12 rounded-2xl bg-rose-500 text-white flex items-center justify-center shadow-xs">
                            <i data-lucide="heart-handshake" class="w-6 h-6"></i>
                        </div>
                        <span class="text-xs font-bold text-gray-800">Nursing Timer</span>
                    </button>
                `;
            }
            if(child.showSleep !== false) {
                const isSleeping = !!child.activeSleepStart;
                html += `
                    <button onclick="openSleepTimer()" class="bg-gradient-to-b from-purple-50/50 to-white p-4 rounded-2xl shadow-sm border border-purple-100 flex flex-col items-center justify-center gap-2.5 active:scale-95 transition">
                        <div class="w-12 h-12 rounded-2xl ${isSleeping ? 'bg-purple-600 text-white animate-pulse' : 'bg-purple-500 text-white'} flex items-center justify-center shadow-xs">
                            <i data-lucide="moon-star" class="w-6 h-6"></i>
                        </div>
                        <span class="text-xs font-bold text-gray-800">${isSleeping ? 'Sleeping...' : 'Sleep Timer'}</span>
                    </button>
                `;
            }
            if(child.showBottle !== false) {
                html += `
                    <button onclick="openManualModal('bottle')" class="bg-gradient-to-b from-blue-50/50 to-white p-4 rounded-2xl shadow-sm border border-blue-100 flex flex-col items-center justify-center gap-2.5 active:scale-95 transition">
                        <div class="w-12 h-12 rounded-2xl bg-blue-500 text-white flex items-center justify-center shadow-xs">
                            <i data-lucide="milk" class="w-6 h-6"></i>
                        </div>
                        <span class="text-xs font-bold text-gray-800">Bottle Feed</span>
                    </button>
                `;
            }
            if(child.showDiaper !== false) {
                html += `
                    <button onclick="openManualModal('diaper')" class="bg-gradient-to-b from-amber-50/50 to-white p-4 rounded-2xl shadow-sm border border-amber-100 flex flex-col items-center justify-center gap-2.5 active:scale-95 transition">
                        <div class="w-12 h-12 rounded-2xl bg-amber-500 text-white flex items-center justify-center shadow-xs">
                            <i data-lucide="layers" class="w-6 h-6"></i>
                        </div>
                        <span class="text-xs font-bold text-gray-800">Diaper Change</span>
                    </button>
                `;
            }
            grid.innerHTML = html;
        }

        // --- Log Feed Filters ---
        function handleDateRangeChange() {
            const range = document.getElementById('filterDateRange').value;
            const customContainer = document.getElementById('customDateContainer');
            customContainer.classList.toggle('hidden', range !== 'custom');
            applyFilters();
        }

        function applyFilters() { renderLogs(); }

        // --- Logs Feed & Mass Selection ---
        function toggleMassSelectMode() {
            isMassSelectMode = !isMassSelectMode;
            selectedLogIds.clear();
            document.getElementById('toggleSelectBtn').innerText = isMassSelectMode ? 'Cancel' : 'Select';
            document.getElementById('selectAllBtn').classList.toggle('hidden', !isMassSelectMode);
            document.getElementById('deleteSelectedBtn').classList.toggle('hidden', !isMassSelectMode);
            renderLogs();
        }

        function toggleSelectAllLogs() {
            const visibleLogs = getFilteredLogs();
            if (selectedLogIds.size === visibleLogs.length) {
                selectedLogIds.clear();
            } else {
                visibleLogs.forEach(l => selectedLogIds.add(l.id));
            }
            renderLogs();
        }

        function toggleLogSelection(id) {
            if (selectedLogIds.has(id)) selectedLogIds.delete(id);
            else selectedLogIds.add(id);
            renderLogs();
        }

        function deleteSelectedLogs() {
            if (selectedLogIds.size === 0) return alert("Select at least one log entry to delete.");
            if (confirm(`Delete ${selectedLogIds.size} log item(s)?`)) {
                state.logs = state.logs.filter(l => !selectedLogIds.has(l.id));
                selectedLogIds.clear();
                toggleMassSelectMode();
                saveData();
            }
        }

        function getFilteredLogs() {
            let logs = (state.logs || []).filter(l => !state.selectedChildId || l.childId === state.selectedChildId);

            // Filter by Type
            const typeFilter = document.getElementById('filterType') ? document.getElementById('filterType').value : 'all';
            if (typeFilter !== 'all') {
                logs = logs.filter(l => l.type === typeFilter);
            }

            // Filter by Date Range
            const dateRange = document.getElementById('filterDateRange') ? document.getElementById('filterDateRange').value : 'all';
            const now = new Date();

            if (dateRange === 'today') {
                const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
                logs = logs.filter(l => l.startTime >= startOfDay);
            } else if (dateRange === '7days') {
                const sevenDaysAgo = Date.now() - (7 * 86400000);
                logs = logs.filter(l => l.startTime >= sevenDaysAgo);
            } else if (dateRange === 'custom') {
                const startVal = document.getElementById('filterStartDate').value;
                const endVal = document.getElementById('filterEndDate').value;
                if (startVal) {
                    const startTime = new Date(startVal + 'T00:00:00').getTime();
                    logs = logs.filter(l => l.startTime >= startTime);
                }
                if (endVal) {
                    const endTime = new Date(endVal + 'T23:59:59').getTime();
                    logs = logs.filter(l => l.startTime <= endTime);
                }
            }

            return logs;
        }

        function renderLogs() {
            const container = document.getElementById('logsContainer');
            let logs = getFilteredLogs();

            if (logs.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-gray-400 text-xs bg-white rounded-2xl border border-gray-100">No matching logs found.</div>`;
                return;
            }

            let html = '';
            logs.sort((a,b) => b.startTime - a.startTime).forEach(log => {
                const childObj = state.children.find(c => c.id === log.childId);
                const timeStr = new Date(log.startTime).toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + new Date(log.startTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                let icon = 'milk', color = 'bg-blue-500', detail = '';
                if(log.type === 'nursing') { icon = 'heart-handshake'; color = 'bg-rose-500'; detail = `Side: ${log.side || 'Left'}`; }
                if(log.type === 'sleep') { icon = 'moon-star'; color = 'bg-purple-500'; detail = log.endTime ? `${Math.round((log.endTime - log.startTime)/60000)} mins` : 'Ongoing'; }
                if(log.type === 'bottle') { icon = 'milk'; color = 'bg-blue-500'; detail = `${log.amount} oz`; }
                if(log.type === 'diaper') { icon = 'layers'; color = 'bg-amber-500'; detail = `Type: ${log.diaperType}`; }

                const isChecked = selectedLogIds.has(log.id);

                html += `
                    <div class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between gap-2">
                        <div class="flex items-center gap-3 overflow-hidden">
                            ${isMassSelectMode ? `<input type="checkbox" ${isChecked ? 'checked' : ''} onclick="toggleLogSelection('${log.id}')" class="w-4 h-4 accent-rose-500 rounded">` : ''}
                            <div class="w-9 h-9 rounded-full ${color} text-white flex items-center justify-center shrink-0">
                                <i data-lucide="${icon}" class="w-4 h-4"></i>
                            </div>
                            <div class="truncate">
                                <div class="text-sm font-bold text-gray-800 capitalize">${log.type} ${childObj && state.selectedChildId === null ? '• ' + childObj.name : ''}</div>
                                <div class="text-xs text-gray-500 truncate">${detail} ${log.notes ? '— ' + log.notes : ''}</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <span class="text-[11px] font-medium text-gray-400">${timeStr}</span>
                            ${!isMassSelectMode ? `<button onclick="editLog('${log.id}')" class="text-gray-400 hover:text-gray-700 p-1"><i data-lucide="edit-2" class="w-3.5 h-3.5"></i></button>` : ''}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // --- Visual Time-Block Daily Calendar View ---
        function openCalendarModal() {
            document.getElementById('modalTitle').innerText = "Daily Time Grid";
            document.getElementById('appModal').classList.remove('hidden');
            renderVisualCalendar();
        }

        function changeCalDate(offsetDays) {
            selectedCalDate.setDate(selectedCalDate.getDate() + offsetDays);
            renderVisualCalendar();
        }

        function renderVisualCalendar() {
            const dateStr = selectedCalDate.toLocaleDateString([], { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
            
            const startOfDay = new Date(selectedCalDate.getFullYear(), selectedCalDate.getMonth(), selectedCalDate.getDate(), 0, 0, 0).getTime();
            const endOfDay = startOfDay + 86400000;

            const dayLogs = (state.logs || []).filter(l => {
                const matchChild = !state.selectedChildId || l.childId === state.selectedChildId;
                return matchChild && l.startTime >= startOfDay && l.startTime < endOfDay;
            });

            let blocksHtml = '';

            for (let hour = 0; hour < 24; hour++) {
                const hourLabel = new Date(startOfDay + hour * 3600000).toLocaleTimeString([], { hour: 'numeric', hour12: true });
                blocksHtml += `
                    <div class="flex items-center h-12 border-b border-gray-100 text-[10px] text-gray-400 relative">
                        <span class="w-12 shrink-0 font-medium">${hourLabel}</span>
                        <div class="flex-1 h-full border-l border-gray-100"></div>
                    </div>
                `;
            }

            let eventsHtml = '';
            dayLogs.forEach(l => {
                const offsetMinutes = (l.startTime - startOfDay) / 60000;
                const topPx = (offsetMinutes / 60) * 48;

                let durationMins = 30;
                if (l.endTime && l.endTime > l.startTime) {
                    durationMins = Math.max(15, (l.endTime - l.startTime) / 60000);
                }
                const heightPx = Math.min(200, (durationMins / 60) * 48);

                let badgeBg = 'bg-blue-100 text-blue-800 border-blue-300';
                if (l.type === 'nursing') badgeBg = 'bg-rose-100 text-rose-800 border-rose-300';
                if (l.type === 'sleep') badgeBg = 'bg-purple-100 text-purple-800 border-purple-300';
                if (l.type === 'diaper') badgeBg = 'bg-amber-100 text-amber-800 border-amber-300';

                const timeFormatted = new Date(l.startTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                eventsHtml += `
                    <div style="top: ${topPx}px; height: ${heightPx}px;" class="absolute left-12 right-2 rounded-lg p-1.5 border text-xs font-semibold shadow-xs overflow-hidden ${badgeBg}">
                        <div class="flex justify-between items-center text-[10px]">
                            <span class="font-bold capitalize">${l.type}</span>
                            <span>${timeFormatted}</span>
                        </div>
                        <div class="text-[10px] opacity-80 truncate">${l.amount ? l.amount + ' oz' : (l.diaperType || l.side || '')}</div>
                    </div>
                `;
            });

            document.getElementById('modalBody').innerHTML = `
                <div class="space-y-3">
                    <div class="flex items-center justify-between bg-white p-2 rounded-xl border border-gray-200">
                        <button onclick="changeCalDate(-1)" class="p-1 rounded-lg hover:bg-gray-100"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
                        <span class="text-xs font-bold text-gray-800">${dateStr}</span>
                        <button onclick="changeCalDate(1)" class="p-1 rounded-lg hover:bg-gray-100"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
                    </div>

                    <div class="relative max-h-96 overflow-y-auto bg-white rounded-xl border border-gray-200 p-2">
                        ${blocksHtml}
                        <div class="absolute inset-0 pointer-events-none">
                            ${eventsHtml}
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        // --- Log Editing Feature ---
        function editLog(logId) {
            const log = state.logs.find(l => l.id === logId);
            if (!log) return;

            document.getElementById('modalTitle').innerText = `Edit ${log.type.toUpperCase()} Entry`;
            document.getElementById('appModal').classList.remove('hidden');

            const dateIso = new Date(log.startTime).toISOString().slice(0, 16);

            let typeSpecificHtml = '';
            if (log.type === 'bottle') {
                typeSpecificHtml = `
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase">Amount (oz)</label>
                        <input id="editAmount" type="number" step="0.5" value="${log.amount || 0}" class="w-full mt-1 bg-white border border-gray-200 rounded-xl p-3 text-sm font-bold">
                    </div>
                `;
            } else if (log.type === 'diaper') {
                typeSpecificHtml = `
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase">Diaper Type</label>
                        <select id="editDiaperType" class="w-full mt-1 bg-white border border-gray-200 rounded-xl p-3 text-sm font-semibold">
                            <option value="Wet" ${log.diaperType === 'Wet' ? 'selected' : ''}>Wet</option>
                            <option value="Dirty" ${log.diaperType === 'Dirty' ? 'selected' : ''}>Dirty</option>
                            <option value="Both" ${log.diaperType === 'Both' ? 'selected' : ''}>Both</option>
                        </select>
                    </div>
                `;
            }

            document.getElementById('modalBody').innerHTML = `
                <div class="space-y-3">
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase">Date & Time</label>
                        <input id="editTime" type="datetime-local" value="${dateIso}" class="w-full mt-1 bg-white border border-gray-200 rounded-xl p-3 text-sm">
                    </div>
                    ${typeSpecificHtml}
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase">Notes</label>
                        <input id="editNotes" type="text" value="${log.notes || ''}" class="w-full mt-1 bg-white border border-gray-200 rounded-xl p-3 text-sm">
                    </div>
                    <div class="flex gap-2 pt-2">
                        <button onclick="saveLogEdit('${log.id}')" class="flex-1 bg-rose-500 text-white font-bold py-3 rounded-xl shadow-sm">Save Changes</button>
                        <button onclick="deleteLog('${log.id}')" class="bg-rose-50 text-rose-600 font-bold px-4 py-3 rounded-xl">Delete</button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function saveLogEdit(logId) {
            const log = state.logs.find(l => l.id === logId);
            if (!log) return;

            const timeVal = document.getElementById('editTime').value;
            if (timeVal) log.startTime = new Date(timeVal).getTime();
            log.notes = document.getElementById('editNotes').value;

            if (log.type === 'bottle') log.amount = parseFloat(document.getElementById('editAmount').value) || 0;
            if (log.type === 'diaper') log.diaperType = document.getElementById('editDiaperType').value;

            closeModal();
            saveData();
        }

        function deleteLog(logId) {
            if (confirm("Delete this log entry?")) {
                state.logs = state.logs.filter(l => l.id !== logId);
                closeModal();
                saveData();
            }
        }

        // --- Settings & Child State Handling with Per-Child Action Customization ---
        function openSettings() {
            document.getElementById('modalTitle').innerText = `Settings (${currentUser})`;
            document.getElementById('appModal').classList.remove('hidden');

            let childrenHtml = '';
            (state.children || []).forEach(c => {
                childrenHtml += `
                    <div class="bg-white p-3 rounded-xl space-y-3 border border-gray-100">
                        <input type="text" value="${c.name || ''}" onchange="updateChildProp('${c.id}', 'name', this.value)" class="w-full font-bold bg-gray-50 border border-gray-200 rounded-lg p-2 text-sm">
                        
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[10px] font-bold text-gray-400 uppercase">Gender</label>
                                <select onchange="updateChildProp('${c.id}', 'gender', this.value)" class="w-full mt-0.5 bg-gray-50 border border-gray-200 rounded-lg p-2 text-xs font-semibold text-gray-700">
                                    <option value="unspecified" ${c.gender === 'unspecified' ? 'selected' : ''}>Unspecified</option>
                                    <option value="boy" ${c.gender === 'boy' ? 'selected' : ''}>Boy</option>
                                    <option value="girl" ${c.gender === 'girl' ? 'selected' : ''}>Girl</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] font-bold text-gray-400 uppercase">Birthdate</label>
                                <input type="date" value="${c.birthdate || ''}" onchange="updateChildProp('${c.id}', 'birthdate', this.value)" class="w-full mt-0.5 bg-gray-50 border border-gray-200 rounded-lg p-2 text-xs font-medium text-gray-700">
                            </div>
                        </div>

                        <!-- Per-Child Action Tiles Toggles -->
                        <div class="pt-2 border-t border-gray-100 space-y-1.5">
                            <span class="text-[10px] font-bold text-gray-400 uppercase tracking-wider block">Visible Action Tiles</span>
                            <div class="grid grid-cols-2 gap-2 text-xs">
                                <label class="flex items-center gap-2 bg-gray-50 p-2 rounded-lg border border-gray-100">
                                    <input type="checkbox" ${c.showNursing !== false ? 'checked' : ''} onchange="updateChildProp('${c.id}', 'showNursing', this.checked)" class="accent-rose-500 rounded">
                                    <span class="font-semibold text-gray-700">Nursing</span>
                                </label>
                                <label class="flex items-center gap-2 bg-gray-50 p-2 rounded-lg border border-gray-100">
                                    <input type="checkbox" ${c.showSleep !== false ? 'checked' : ''} onchange="updateChildProp('${c.id}', 'showSleep', this.checked)" class="accent-purple-500 rounded">
                                    <span class="font-semibold text-gray-700">Sleep</span>
                                </label>
                                <label class="flex items-center gap-2 bg-gray-50 p-2 rounded-lg border border-gray-100">
                                    <input type="checkbox" ${c.showBottle !== false ? 'checked' : ''} onchange="updateChildProp('${c.id}', 'showBottle', this.checked)" class="accent-blue-500 rounded">
                                    <span class="font-semibold text-gray-700">Bottle</span>
                                </label>
                                <label class="flex items-center gap-2 bg-gray-50 p-2 rounded-lg border border-gray-100">
                                    <input type="checkbox" ${c.showDiaper !== false ? 'checked' : ''} onchange="updateChildProp('${c.id}', 'showDiaper', this.checked)" class="accent-amber-500 rounded">
                                    <span class="font-semibold text-gray-700">Diaper</span>
                                </label>
                            </div>
                        </div>
                    </div>
                `;
            });

            document.getElementById('modalBody').innerHTML = `
                <div class="space-y-3">
                    <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Child Profiles</h4>
                    ${childrenHtml}
                    <button onclick="handleLogout()" class="w-full bg-rose-50 text-rose-600 font-bold py-3 rounded-xl mt-2 flex items-center justify-center gap-2">
                        <i data-lucide="log-out" class="w-4 h-4"></i> Logout Account
                    </button>
                    <button onclick="closeModal()" class="w-full bg-rose-500 text-white font-bold py-3 rounded-xl mt-2">Done</button>
                </div>
            `;
            lucide.createIcons();
        }

        function updateChildProp(id, prop, val) {
            const c = state.children.find(ch => ch.id === id);
            if (c) {
                c[prop] = val;
                saveData();
            }
        }

        // --- Action Timer Functions ---
        function openManualModal(type) {
            const modal = document.getElementById('appModal');
            document.getElementById('modalTitle').innerText = `Log ${type.toUpperCase()}`;
            modal.classList.remove('hidden');

            let bodyHtml = type === 'bottle' ? `
                <div class="space-y-3">
                    <input id="manualAmount" type="number" step="0.5" value="4.0" class="w-full bg-white border border-gray-200 rounded-xl p-3 text-lg font-bold">
                    <input id="manualNotes" type="text" placeholder="Optional notes..." class="w-full bg-white border border-gray-200 rounded-xl p-3 text-sm">
                    <button onclick="saveManualEntry('bottle')" class="w-full bg-blue-500 text-white font-bold py-3 rounded-xl">Save Bottle Log</button>
                </div>` : `
                <div class="space-y-3">
                    <select id="manualDiaperType" class="w-full bg-white border border-gray-200 rounded-xl p-3 text-base font-semibold">
                        <option value="Wet">Wet</option><option value="Dirty">Dirty</option><option value="Both">Both</option>
                    </select>
                    <input id="manualNotes" type="text" placeholder="Optional notes..." class="w-full bg-white border border-gray-200 rounded-xl p-3 text-sm">
                    <button onclick="saveManualEntry('diaper')" class="w-full bg-amber-500 text-white font-bold py-3 rounded-xl">Save Diaper Log</button>
                </div>`;
            document.getElementById('modalBody').innerHTML = bodyHtml;
        }

        function saveManualEntry(type) {
            const child = getActiveChild();
            const log = {
                id: Date.now().toString() + Math.random().toString(36).substring(2,5),
                type: type,
                startTime: Date.now(),
                childId: child.id,
                notes: document.getElementById('manualNotes').value
            };
            if (type === 'bottle') log.amount = parseFloat(document.getElementById('manualAmount').value) || 0;
            if (type === 'diaper') log.diaperType = document.getElementById('manualDiaperType').value;
            state.logs.push(log);
            closeModal();
            saveData();
        }

        function quickDiaper(type) {
            const child = getActiveChild();
            state.logs.push({
                id: Date.now().toString() + Math.random().toString(36).substring(2,5),
                type: 'diaper',
                diaperType: type,
                startTime: Date.now(),
                childId: child.id,
                notes: 'Quick Log'
            });
            saveData();
        }

        function openSleepTimer() {
            const child = getActiveChild();
            const modal = document.getElementById('appModal');
            document.getElementById('modalTitle').innerText = "Sleep Tracker";
            modal.classList.remove('hidden');
            const isSleeping = !!child.activeSleepStart;

            document.getElementById('modalBody').innerHTML = `
                <div class="space-y-4 text-center">
                    ${isSleeping ? `<button onclick="stopSleepTimer()" class="w-full bg-purple-600 text-white font-bold py-4 rounded-xl shadow-sm">Wake Up</button>` : `<button onclick="startSleepTimer()" class="w-full bg-purple-500 text-white font-bold py-4 rounded-xl shadow-sm">Start Sleep</button>`}
                </div>
            `;
        }

        function startSleepTimer() { getActiveChild().activeSleepStart = Date.now(); closeModal(); saveData(); }
        function stopSleepTimer() {
            const child = getActiveChild();
            if (child.activeSleepStart) {
                state.logs.push({ id: Date.now().toString(), type: 'sleep', startTime: child.activeSleepStart, endTime: Date.now(), childId: child.id });
                child.activeSleepStart = null;
            }
            closeModal();
            saveData();
        }

        function closeModal() { document.getElementById('appModal').classList.add('hidden'); }
    </script>
</body>
</html>
