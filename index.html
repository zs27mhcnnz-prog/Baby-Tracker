<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baby Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Canvas Confetti for Birthdays -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen pb-12 select-none">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-30 bg-[#f2f2f7]/80 backdrop-blur-md border-b border-gray-200 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <h1 class="text-xl font-bold tracking-tight">Baby Tracker</h1>
            <span id="syncStatus" class="w-2 h-2 rounded-full bg-amber-400" title="Syncing..."></span>
        </div>
        <button onclick="openSettings()" class="w-8 h-8 rounded-full bg-gray-200/60 flex items-center justify-center text-gray-700 active:scale-95 transition">
            <i data-lucide="settings" class="w-4 h-4"></i>
        </button>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto px-4 pt-4 space-y-4">
        
        <!-- Child Profile Selector Tabs -->
        <div id="childSelector" class="flex gap-2 overflow-x-auto pb-1 no-scrollbar"></div>

        <!-- 24-Hour Pediatrician Summary Card -->
        <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-1.5 text-rose-500 font-semibold text-sm">
                    <i data-lucide="cross" class="w-4 h-4"></i>
                    <span>24-Hour Summary</span>
                </div>
                <span class="text-[10px] font-bold uppercase tracking-wider bg-rose-50 text-rose-500 px-2 py-0.5 rounded-full">Pediatrician View</span>
            </div>
            <div class="grid grid-cols-3 gap-2 text-center">
                <div class="bg-blue-50/60 rounded-xl p-2.5">
                    <i data-lucide="droplet" class="w-4 h-4 text-blue-500 mx-auto mb-1"></i>
                    <div id="summaryFormula" class="font-bold text-sm text-gray-800">0.0 oz</div>
                    <div class="text-[10px] text-gray-500 font-medium">Formula</div>
                </div>
                <div class="bg-purple-50/60 rounded-xl p-2.5">
                    <i data-lucide="moon" class="w-4 h-4 text-purple-500 mx-auto mb-1"></i>
                    <div id="summarySleep" class="font-bold text-sm text-gray-800">0.0h</div>
                    <div class="text-[10px] text-gray-500 font-medium">Sleep</div>
                </div>
                <div class="bg-orange-50/60 rounded-xl p-2.5">
                    <i data-lucide="layers" class="w-4 h-4 text-orange-400 mx-auto mb-1"></i>
                    <div id="summaryDiapers" class="font-bold text-sm text-gray-800">0W / 0D</div>
                    <div class="text-[10px] text-gray-500 font-medium">Diapers</div>
                </div>
            </div>
        </div>

        <!-- Dynamic Action Buttons Grid -->
        <div id="actionGrid" class="grid grid-cols-2 gap-3"></div>

        <!-- Instant Diaper Log Chips -->
        <div id="instantDiaperSection" class="space-y-1.5">
            <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider px-1">Instant Diaper Log</span>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="quickDiaper('Wet')" class="bg-blue-50 text-blue-600 font-semibold text-xs py-2.5 rounded-full flex items-center justify-center gap-1 active:scale-95 transition">
                    <i data-lucide="droplet" class="w-3.5 h-3.5"></i> Wet
                </button>
                <button onclick="quickDiaper('Dirty')" class="bg-amber-50 text-amber-700 font-semibold text-xs py-2.5 rounded-full flex items-center justify-center gap-1 active:scale-95 transition">
                    <i data-lucide="circle" class="w-3.5 h-3.5"></i> Dirty
                </button>
                <button onclick="quickDiaper('Both')" class="bg-purple-50 text-purple-600 font-semibold text-xs py-2.5 rounded-full flex items-center justify-center gap-1 active:scale-95 transition">
                    <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Both
                </button>
            </div>
        </div>

        <!-- Recent Logs Feed -->
        <div class="space-y-2 pt-2">
            <h2 class="text-sm font-bold text-gray-800 px-1">Recent Logs</h2>
            <div id="logsContainer" class="space-y-2"></div>
        </div>
    </main>

    <!-- Generic Modal Sheet -->
    <div id="appModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 hidden flex items-end transition-opacity">
        <div class="bg-[#f2f2f7] w-full max-w-md mx-auto rounded-t-3xl max-h-[90vh] overflow-y-auto p-5 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b border-gray-200 pb-3">
                <h3 id="modalTitle" class="font-bold text-lg text-gray-900">Log Entry</h3>
                <button onclick="closeModal()" class="text-gray-400 font-semibold text-sm">Cancel</button>
            </div>
            <div id="modalBody" class="space-y-4"></div>
        </div>
    </div>

    <!-- Application JavaScript Logic -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQXwiSr4NpYe4sV0gdrhiGmbBskpXWkAzF0Zi2riS-UxuVjqgAI1_IydbLi3PovPk/exec";

        let state = {
            children: [{ id: '1', name: 'Baby', birthdate: '', showNursing: true, showBottle: true, showDiaper: true, showSleep: true, activeSleepStart: null, lastConfettiTime: null }],
            selectedChildId: '1',
            logs: []
        };

        // Initialize App by loading from Google Sheet (with localStorage fallback)
        async function loadData() {
            const statusDot = document.getElementById('syncStatus');
            try {
                const response = await fetch(SCRIPT_URL);
                const cloudData = await response.json();
                if (cloudData && cloudData.children && cloudData.logs) {
                    state = cloudData;
                    localStorage.setItem('babyTrackerState', JSON.stringify(state));
                }
                statusDot.className = "w-2 h-2 rounded-full bg-emerald-500";
                statusDot.title = "Synced with Google Sheet";
            } catch (err) {
                console.log("Offline or cloud fetch failed, falling back to local cache.");
                statusDot.className = "w-2 h-2 rounded-full bg-amber-400";
                statusDot.title = "Offline / Local Mode";
                const local = localStorage.getItem('babyTrackerState');
                if (local) {
                    try { state = JSON.parse(local); } catch(e) {}
                }
            }
            render();
            checkBirthdayCelebration();
        }

        async function saveData() {
            const statusDot = document.getElementById('syncStatus');
            statusDot.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";
            statusDot.title = "Syncing...";

            // Save immediately to local cache for instant UI feedback
            localStorage.setItem('babyTrackerState', JSON.stringify(state));
            render();

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(state)
                });
                statusDot.className = "w-2 h-2 rounded-full bg-emerald-500";
                statusDot.title = "Synced with Google Sheet";
            } catch (err) {
                console.error("Failed to sync to Google Sheet:", err);
                statusDot.className = "w-2 h-2 rounded-full bg-red-500";
                statusDot.title = "Sync Failed (Saved Locally)";
            }
        }

        // Live ticker for minimized sleep timer card
        setInterval(() => {
            const child = getActiveChild();
            if (child && child.activeSleepStart) {
                const elapsed = Math.floor((Date.now() - child.activeSleepStart) / 1000);
                const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
                const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
                const s = String(elapsed % 60).padStart(2, '0');
                const minDisplay = document.getElementById('minimizedSleepDisplay');
                if (minDisplay) minDisplay.innerText = `${h}:${m}:${s}`;
            }
        }, 1000);

        function render() {
            lucide.createIcons();
            renderChildSelector();
            renderSummary();
            renderActionGrid();
            renderLogs();
        }

        function renderChildSelector() {
            const container = document.getElementById('childSelector');
            let html = `<button onclick="selectChild(null)" class="px-4 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap ${!state.selectedChildId ? 'bg-rose-500 text-white' : 'bg-white text-gray-700 shadow-xs'}">All Children</button>`;
            
            state.children.forEach(child => {
                const isSelected = state.selectedChildId === child.id;
                html += `<button onclick="selectChild('${child.id}')" class="px-4 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap ${isSelected ? 'bg-rose-500 text-white' : 'bg-white text-gray-700 shadow-xs'}">${child.name}</button>`;
            });
            container.innerHTML = html;
        }

        function selectChild(id) {
            state.selectedChildId = id;
            saveData();
            checkBirthdayCelebration();
        }

        function checkBirthdayCelebration() {
            const child = getActiveChild();
            if (!child || !child.birthdate) return;

            const today = new Date();
            const [bYear, bMonth, bDay] = child.birthdate.split('-').map(Number);

            if (today.getMonth() + 1 === bMonth && today.getDate() === bDay) {
                const oneHour = 3600000;
                if (!child.lastConfettiTime || (Date.now() - child.lastConfettiTime > oneHour)) {
                    // Trigger Confetti Animation
                    confetti({
                        particleCount: 120,
                        spread: 80,
                        origin: { y: 0.3 }
                    });
                    child.lastConfettiTime = Date.now();
                    saveData();
                }
            }
        }

        function getActiveChild() {
            return state.children.find(c => c.id === state.selectedChildId) || state.children[0];
        }

        function filteredLogs() {
            if (!state.selectedChildId) return state.logs;
            return state.logs.filter(l => l.childId === state.selectedChildId);
        }

        function renderSummary() {
            const logs = filteredLogs();
            const cutoff = Date.now() - 86400000;
            const recent = logs.filter(l => l.startTime >= cutoff);

            const formula = recent.filter(l => l.type === 'bottle').reduce((acc, l) => acc + (l.amount || 0), 0);
            const wet = recent.filter(l => l.type === 'diaper' && (l.diaperType === 'Wet' || l.diaperType === 'Both')).length;
            const dirty = recent.filter(l => l.type === 'diaper' && (l.diaperType === 'Dirty' || l.diaperType === 'Both')).length;
            const sleepMs = recent.filter(l => l.type === 'sleep').reduce((acc, l) => acc + ((l.endTime || Date.now()) - l.startTime), 0);

            document.getElementById('summaryFormula').innerText = formula.toFixed(1) + ' oz';
            document.getElementById('summarySleep').innerText = (sleepMs / 3600000).toFixed(1) + 'h';
            document.getElementById('summaryDiapers').innerText = `${wet}W / ${dirty}D`;
        }

        function renderActionGrid() {
            const child = getActiveChild();
            const grid = document.getElementById('actionGrid');
            const diaperSection = document.getElementById('instantDiaperSection');
            
            if(!child) return;
            if(!child.showDiaper) diaperSection.classList.add('hidden'); else diaperSection.classList.remove('hidden');

            let html = '';
            if(child.showNursing) {
                html += `
                    <button onclick="openNursingTimer()" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2 active:scale-95 transition">
                        <div class="w-10 h-10 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center"><i data-lucide="timer" class="w-5 h-5"></i></div>
                        <span class="text-xs font-bold text-gray-800">Nursing Timer</span>
                    </button>
                `;
            }
            if(child.showSleep) {
                if(child.activeSleepStart) {
                    const elapsed = Math.floor((Date.now() - child.activeSleepStart) / 1000);
                    const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
                    const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
                    const s = String(elapsed % 60).padStart(2, '0');
                    html += `
                        <button onclick="openSleepTimer()" class="bg-purple-50 border border-purple-200 p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-1 active:scale-95 transition">
                            <div class="w-10 h-10 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center"><i data-lucide="moon-star" class="w-5 h-5 animate-pulse"></i></div>
                            <span id="minimizedSleepDisplay" class="text-xs font-mono font-bold text-purple-900">${h}:${m}:${s}</span>
                        </button>
                    `;
                } else {
                    html += `
                        <button onclick="openSleepTimer()" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2 active:scale-95 transition">
                            <div class="w-10 h-10 rounded-full bg-purple-50 text-purple-500 flex items-center justify-center"><i data-lucide="moon-star" class="w-5 h-5"></i></div>
                            <span class="text-xs font-bold text-gray-800">Sleep Timer</span>
                        </button>
                    `;
                }
            }
            if(child.showBottle) {
                html += `
                    <button onclick="openManualModal('bottle')" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2 active:scale-95 transition">
                        <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center"><i data-lucide="droplet" class="w-5 h-5"></i></div>
                        <span class="text-xs font-bold text-gray-800">Bottle</span>
                    </button>
                `;
            }
            if(child.showDiaper) {
                html += `
                    <button onclick="openManualModal('diaper')" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2 active:scale-95 transition">
                        <div class="w-10 h-10 rounded-full bg-orange-50 text-orange-400 flex items-center justify-center"><i data-lucide="layers" class="w-5 h-5"></i></div>
                        <span class="text-xs font-bold text-gray-800">Diaper</span>
                    </button>
                `;
            }
            grid.innerHTML = html;
        }

        function renderLogs() {
            const container = document.getElementById('logsContainer');
            const logs = filteredLogs();

            if (logs.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-gray-400 text-xs">No logs yet. Tap an action above to start.</div>`;
                return;
            }

            let html = '';
            logs.sort((a,b) => b.startTime - a.startTime).forEach(log => {
                const childObj = state.children.find(c => c.id === log.childId);
                const timeStr = new Date(log.startTime).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                let icon = 'droplet', color = 'bg-blue-500', detail = '';
                if(log.type === 'nursing') { icon = 'heart'; color = 'bg-rose-500'; detail = `Side: ${log.side || 'Left'} (${Math.round(((log.endTime || log.startTime) - log.startTime)/60000)}m)`; }
                if(log.type === 'sleep') { icon = 'moon'; color = 'bg-purple-500'; detail = log.endTime ? `${Math.round((log.endTime - log.startTime)/60000)} mins` : 'In Progress'; }
                if(log.type === 'bottle') { icon = 'droplet'; color = 'bg-blue-500'; detail = `${log.amount} oz`; }
                if(log.type === 'diaper') { icon = 'layers'; color = 'bg-orange-400'; detail = `Type: ${log.diaperType}`; }

                html += `
                    <div onclick="openEditModal('${log.id}')" class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between active:scale-98 transition cursor-pointer">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-full ${color} text-white flex items-center justify-center shrink-0">
                                <i data-lucide="${icon}" class="w-4 h-4"></i>
                            </div>
                            <div>
                                <div class="text-sm font-bold text-gray-800 capitalize">${log.type} ${childObj ? '• ' + childObj.name : ''}</div>
                                <div class="text-xs text-gray-500">${detail} ${log.notes ? '— ' + log.notes : ''}</div>
                            </div>
                        </div>
                        <div class="text-[11px] font-medium text-gray-400">${timeStr}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function quickDiaper(type) {
            const child = getActiveChild();
            if(!child) return;
            state.logs.push({
                id: Date.now().toString(),
                type: 'diaper',
                diaperType: type,
                startTime: Date.now(),
                childId: child.id,
                notes: 'Quick Log'
            });
            saveData();
        }

        // --- Live Nursing Timer ---
        function openNursingTimer() {
            const modal = document.getElementById('appModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            modal.classList.remove('hidden');
            title.innerText = "Live Nursing Timer";

            body.innerHTML = `
                <div class="space-y-4 text-center">
                    <select id="nursingSide" class="w-full bg-white border border-gray-200 rounded-xl p-3 text-base font-semibold">
                        <option value="Left">Left Side</option>
                        <option value="Right">Right Side</option>
                        <option value="Both">Both Sides</option>
                    </select>
                    <div id="nursingDisplay" class="text-5xl font-mono font-bold text-rose-500 py-4">00:00</div>
                    <div class="flex gap-2">
                        <button id="nursingToggleBtn" onclick="toggleNursingTimer()" class="flex-1 bg-amber-500 text-white font-bold py-3 rounded-xl">Pause</button>
                        <button onclick="resetNursingTimer()" class="bg-gray-200 text-gray-700 font-bold px-4 py-3 rounded-xl">Reset</button>
                    </div>
                    <input id="nursingNotes" type="text" placeholder="Optional notes..." class="w-full bg-white border border-gray-200 rounded-xl p-3 text-base">
                    <button onclick="saveNursingTimer()" class="w-full bg-rose-500 text-white font-bold py-3 rounded-xl shadow-sm">Save Entry</button>
                </div>
            `;

            window.nursingElapsed = 0;
            window.nursingRunning = true;
            if(window.nursingInterval) clearInterval(window.nursingInterval);
            window.nursingInterval = setInterval(() => {
                if(window.nursingRunning) {
                    window.nursingElapsed++;
                    const m = String(Math.floor(window.nursingElapsed / 60)).padStart(2, '0');
                    const s = String(window.nursingElapsed % 60).padStart(2, '0');
                    const display = document.getElementById('nursingDisplay');
                    if(display) display.innerText = `${m}:${s}`;
                }
            }, 1000);
        }

        window.toggleNursingTimer = function() {
            window.nursingRunning = !window.nursingRunning;
            document.getElementById('nursingToggleBtn').innerText = window.nursingRunning ? "Pause" : "Start";
            document.getElementById('nursingToggleBtn').className = window.nursingRunning ? "flex-1 bg-amber-500 text-white font-bold py-3 rounded-xl" : "flex-1 bg-rose-500 text-white font-bold py-3 rounded-xl";
        }
        window.resetNursingTimer = function() { window.nursingElapsed = 0; }

        function saveNursingTimer() {
            clearInterval(window.nursingInterval);
            const durationMs = (window.nursingElapsed || 0) * 1000;
            const child = getActiveChild();
            state.logs.push({
                id: Date.now().toString(),
                type: 'nursing',
                startTime: Date.now() - durationMs,
                endTime: Date.now(),
                side: document.getElementById('nursingSide').value,
                notes: document.getElementById('nursingNotes').value,
                childId: child.id
            });
            closeModal();
            saveData();
        }

        // --- Live Sleep Timer ---
        function openSleepTimer() {
            const child = getActiveChild();
            if(!child) return;
            if(!child.activeSleepStart) {
                child.activeSleepStart = Date.now();
                saveData();
            }

            const modal = document.getElementById('appModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            modal.classList.remove('hidden');
            title.innerText = "Sleep Session Active";

            body.innerHTML = `
                <div class="space-y-4 text-center">
                    <div id="sleepDisplay" class="text-5xl font-mono font-bold text-purple-600 py-6">00:00:00</div>
                    <input id="sleepNotes" type="text" placeholder="Sleep notes..." class="w-full bg-white border border-gray-200 rounded-xl p-3 text-base">
                    <button onclick="saveSleepTimer()" class="w-full bg-purple-600 text-white font-bold py-3 rounded-xl shadow-sm">Wake Up & Save</button>
                    <button onclick="cancelSleepTimer()" class="w-full bg-gray-200 text-red-600 font-bold py-3 rounded-xl">Cancel Timer</button>
                    <button onclick="closeModal()" class="text-xs text-gray-500 font-semibold underline">Minimize</button>
                </div>
            `;

            if(window.sleepInterval) clearInterval(window.sleepInterval);
            window.sleepInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - child.activeSleepStart) / 1000);
                const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
                const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
                const s = String(elapsed % 60).padStart(2, '0');
                const display = document.getElementById('sleepDisplay');
                if(display) display.innerText = `${h}:${m}:${s}`;
            }, 1000);
        }

        function saveSleepTimer() {
            clearInterval(window.sleepInterval);
            const child = getActiveChild();
            if(!child || !child.activeSleepStart) return;

            state.logs.push({
                id: Date.now().toString(),
                type: 'sleep',
                startTime: child.activeSleepStart,
                endTime: Date.now(),
                notes: document.getElementById('sleepNotes')?.value || '',
                childId: child.id
            });
            child.activeSleepStart = null;
            closeModal();
            saveData();
        }

        function cancelSleepTimer() {
            clearInterval(window.sleepInterval);
            const child = getActiveChild();
            if(child) child.activeSleepStart = null;
            closeModal();
            saveData();
        }

        // --- Manual Logs (Bottle & Diaper) ---
        function openManualModal(type) {
            const modal = document.getElementById('appModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            modal.classList.remove('hidden');
            title.innerText = `Log ${type.charAt(0).toUpperCase() + type.slice(1)}`;

            if(type === 'bottle') {
                body.innerHTML = `
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Amount (oz)</label>
                        <input id="inputBottleAmount" type="number" step="0.5" value="4.0" class="w-full mt-1 bg-white border border-gray-200 rounded-xl p-3 text-base font-semibold">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Notes</label>
                        <input id="inputNotes" type="text" placeholder="Optional notes..." class="w-full mt-1 bg-white border border-gray-200 rounded-xl p-3 text-base">
                    </div>
                    <button onclick="saveManualData('bottle')" class="w-full bg-rose-500 text-white font-bold py-3 rounded-xl shadow-sm">Save Entry</button>
                `;
            } else if(type === 'diaper') {
                body.innerHTML = `
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Diaper Status</label>
                        <select id="inputDiaperType" class="w-full mt-1 bg-white border border-gray-200 rounded-xl p-3 text-base font-semibold">
                            <option value="Wet">Wet</option>
                            <option value="Dirty">Dirty</option>
                            <option value="Both">Both</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Notes</label>
                        <input id="inputNotes" type="text" placeholder="Optional notes..." class="w-full mt-1 bg-white border border-gray-200 rounded-xl p-3 text-base">
                    </div>
                    <button onclick="saveManualData('diaper')" class="w-full bg-rose-500 text-white font-bold py-3 rounded-xl shadow-sm">Save Entry</button>
                `;
            }
        }

        function saveManualData(type) {
            const child = getActiveChild();
            let newLog = {
                id: Date.now().toString(),
                type: type,
                startTime: Date.now(),
                childId: child.id,
                notes: document.getElementById('inputNotes')?.value || ''
            };
            if(type === 'bottle') newLog.amount = parseFloat(document.getElementById('inputBottleAmount').value) || 4.0;
            if(type === 'diaper') newLog.diaperType = document.getElementById('inputDiaperType').value;

            state.logs.push(newLog);
            closeModal();
            saveData();
        }

        // --- Edit / Delete Log Modal ---
        function openEditModal(logId) {
            const log = state.logs.find(l => l.id === logId);
            if(!log) return;
            const modal = document.getElementById('appModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            modal.classList.remove('hidden');
            title.innerText = `Edit ${log.type.charAt(0).toUpperCase() + log.type.slice(1)}`;

            let specificFieldsHtml = '';

            if (log.type === 'bottle') {
                specificFieldsHtml = `
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Amount (oz)</label>
                        <input id="editBottleAmount" type="number" step="0.5" value="${log.amount || 4.0}" class="w-full mt-1 bg-white border border-gray-200 rounded-xl p-3 text-base font-semibold">
                    </div>
                `;
            } else if (log.type === 'diaper') {
                specificFieldsHtml = `
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Diaper Status</label>
                        <select id="editDiaperType" class="w-full mt-1 bg-white border border-gray-200 rounded-xl p-3 text-base font-semibold">
                            <option value="Wet" ${log.diaperType === 'Wet' ? 'selected' : ''}>Wet</option>
                            <option value="Dirty" ${log.diaperType === 'Dirty' ? 'selected' : ''}>Dirty</option>
                            <option value="Both" ${log.diaperType === 'Both' ? 'selected' : ''}>Both</option>
                        </select>
                    </div>
                `;
            } else if (log.type === 'nursing') {
                const durationMins = Math.round(((log.endTime || log.startTime) - log.startTime) / 60000);
                specificFieldsHtml = `
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Side</label>
                        <select id="editNursingSide" class="w-full mt-1 bg-white border border-gray-200 rounded-xl p-3 text-base font-semibold">
                            <option value="Left" ${log.side === 'Left' ? 'selected' : ''}>Left Side</option>
                            <option value="Right" ${log.side === 'Right' ? 'selected' : ''}>Right Side</option>
                            <option value="Both" ${log.side === 'Both' ? 'selected' : ''}>Both Sides</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Duration (Minutes)</label>
                        <input id="editNursingDuration" type="number" step="1" value="${durationMins}" class="w-full mt-1 bg-white border border-gray-200 rounded-xl p-3 text-base font-semibold">
                    </div>
                `;
            } else if (log.type === 'sleep') {
                const sleepMins = log.endTime ? Math.round((log.endTime - log.startTime) / 60000) : 0;
                specificFieldsHtml = `
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Sleep Duration (Minutes)</label>
                        <input id="editSleepDuration" type="number" step="1" value="${sleepMins}" class="w-full mt-1 bg-white border border-gray-200 rounded-xl p-3 text-base font-semibold">
                    </div>
                `;
            }

            body.innerHTML = `
                ${specificFieldsHtml}
                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Notes</label>
                    <input id="editNotes" type="text" value="${log.notes || ''}" class="w-full mt-1 bg-white border border-gray-200 rounded-xl p-3 text-base">
                </div>
                <button onclick="updateLog('${log.id}')" class="w-full bg-rose-500 text-white font-bold py-3 rounded-xl shadow-sm">Save Changes</button>
                <button onclick="deleteLog('${log.id}')" class="w-full bg-red-100 text-red-600 font-bold py-3 rounded-xl">Delete Log</button>
            `;
        }

        function updateLog(logId) {
            const log = state.logs.find(l => l.id === logId);
            if(!log) return;

            log.notes = document.getElementById('editNotes')?.value || '';

            if (log.type === 'bottle') {
                log.amount = parseFloat(document.getElementById('editBottleAmount').value) || 0;
            } else if (log.type === 'diaper') {
                log.diaperType = document.getElementById('editDiaperType').value;
            } else if (log.type === 'nursing') {
                log.side = document.getElementById('editNursingSide').value;
                const mins = parseFloat(document.getElementById('editNursingDuration').value) || 0;
                log.endTime = log.startTime + (mins * 60000);
            } else if (log.type === 'sleep') {
                const mins = parseFloat(document.getElementById('editSleepDuration').value) || 0;
                log.endTime = log.startTime + (mins * 60000);
            }

            closeModal();
            saveData();
        }

        function deleteLog(logId) {
            state.logs = state.logs.filter(l => l.id !== logId);
            closeModal();
            saveData();
        }

        // --- Data Export & Import Functions ---
        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `baby_tracker_backup_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedState = JSON.parse(e.target.result);
                    if (importedState && importedState.children && importedState.logs) {
                        state = importedState;
                        saveData();
                        alert("Data successfully imported and synced!");
                        closeModal();
                    } else {
                        alert("Invalid backup file format.");
                    }
                } catch (err) {
                    alert("Error parsing JSON file.");
                }
            };
            reader.readAsText(file);
        }

        // --- Settings Modal ---
        function openSettings() {
            const modal = document.getElementById('appModal');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            modal.classList.remove('hidden');
            title.innerText = "Settings & Profiles";

            let childrenHtml = '';
            state.children.forEach(c => {
                childrenHtml += `
                    <div class="bg-white p-3 rounded-xl space-y-2 border border-gray-100">
                        <input type="text" value="${c.name}" onchange="updateChildName('${c.id}', this.value)" class="w-full font-bold bg-gray-50 border border-gray-200 rounded-lg p-2 text-sm">
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase">Birthdate</label>
                            <input type="date" value="${c.birthdate || ''}" onchange="updateChildBirthdate('${c.id}', this.value)" class="w-full mt-0.5 bg-gray-50 border border-gray-200 rounded-lg p-2 text-xs font-medium text-gray-700">
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs font-medium text-gray-600 pt-1">
                            <label><input type="checkbox" ${c.showNursing ? 'checked' : ''} onchange="toggleChildFeature('${c.id}', 'showNursing', this.checked)"> Nursing</label>
                            <label><input type="checkbox" ${c.showBottle ? 'checked' : ''} onchange="toggleChildFeature('${c.id}', 'showBottle', this.checked)"> Bottle</label>
                            <label><input type="checkbox" ${c.showDiaper ? 'checked' : ''} onchange="toggleChildFeature('${c.id}', 'showDiaper', this.checked)"> Diaper</label>
                            <label><input type="checkbox" ${c.showSleep ? 'checked' : ''} onchange="toggleChildFeature('${c.id}', 'showSleep', this.checked)"> Sleep</label>
                        </div>
                    </div>
                `;
            });

            body.innerHTML = `
                <div class="space-y-3">
                    <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Child Profiles</h4>
                    ${childrenHtml}
                    <button onclick="addChildProfile()" class="w-full bg-gray-200 text-gray-800 font-bold py-2.5 rounded-xl text-sm">+ Add Child Profile</button>
                    
                    <div class="bg-white p-3 rounded-xl space-y-2 border border-gray-100 mt-4">
                        <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Cloud & Local Backup</h4>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="exportData()" class="bg-gray-100 text-gray-800 font-bold py-2.5 rounded-xl text-xs active:scale-95 transition">Export JSON</button>
                            <label class="bg-gray-100 text-gray-800 font-bold py-2.5 rounded-xl text-xs active:scale-95 transition text-center cursor-pointer flex items-center justify-center">
                                Import JSON
                                <input type="file" accept=".json" onchange="importData(event)" class="hidden">
                            </label>
                        </div>
                    </div>

                    <button onclick="closeModal()" class="w-full bg-rose-500 text-white font-bold py-3 rounded-xl mt-4">Done</button>
                </div>
            `;
        }

        function updateChildName(id, name) {
            const c = state.children.find(ch => ch.id === id);
            if(c) { c.name = name; saveData(); }
        }

        function updateChildBirthdate(id, birthdate) {
            const c = state.children.find(ch => ch.id === id);
            if(c) { c.birthdate = birthdate; saveData(); }
        }

        function toggleChildFeature(id, feature, val) {
            const c = state.children.find(ch => ch.id === id);
            if(c) { c[feature] = val; saveData(); }
        }

        function addChildProfile() {
            const name = prompt("Enter child name:", "Baby");
            if(name) {
                state.children.push({
                    id: Date.now().toString(),
                    name: name,
                    birthdate: '',
                    showNursing: true,
                    showBottle: true,
                    showDiaper: true,
                    showSleep: true,
                    activeSleepStart: null,
                    lastConfettiTime: null
                });
                saveData();
                openSettings();
            }
        }

        function closeModal() {
            document.getElementById('appModal').classList.add('hidden');
        }

        // Initialize App & Fetch Cloud Data on Load
        loadData();
    </script>
</body>
</html>
