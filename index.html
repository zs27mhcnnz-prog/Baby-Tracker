<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Baby Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Canvas Confetti for Birthdays -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f2f2f7;
            color: #1c1c1e;
            -webkit-tap-highlight-color: transparent;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="flex flex-col min-h-screen pb-12 select-none">

    <!-- Login Screen Container -->
    <div id="loginScreen" class="fixed inset-0 bg-[#f2f2f7] z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-xl border border-gray-100 space-y-5 text-center">
            <div class="w-14 h-14 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto">
                <i data-lucide="lock" class="w-7 h-7"></i>
            </div>
            <div>
                <h2 class="text-xl font-bold text-gray-900">Welcome Back</h2>
                <p class="text-xs text-gray-500 mt-1">Enter your profile name or PIN to load your specific logs.</p>
            </div>
            <div class="space-y-3 text-left">
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Username / ID</label>
                    <input id="loginUser" type="text" placeholder="e.g. Eric" class="w-full mt-1 bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm font-semibold text-gray-800">
                </div>
            </div>
            <button onclick="handleLogin()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 rounded-xl shadow-sm transition active:scale-95 text-sm">
                Unlock Tracker
            </button>
        </div>
    </div>

    <!-- Child Selection Overlay -->
    <div id="childSelectScreen" class="fixed inset-0 bg-[#f2f2f7] z-40 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-xl border border-gray-100 space-y-5 text-center">
            <div class="w-14 h-14 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto">
                <i data-lucide="baby" class="w-7 h-7"></i>
            </div>
            <div>
                <h2 class="text-xl font-bold text-gray-900">Who are we tracking?</h2>
                <p class="text-xs text-gray-500 mt-1">Select a child profile or view all.</p>
            </div>
            <div id="loginChildOptions" class="space-y-2"></div>
            <button onclick="proceedToAllChildren()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-2.5 rounded-xl transition text-xs">
                View All Children
            </button>
        </div>
    </div>

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-30 bg-[#f2f2f7]/80 backdrop-blur-md border-b border-gray-200 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <h1 class="text-xl font-bold tracking-tight">Baby Tracker</h1>
            <span id="syncStatus" class="w-2 h-2 rounded-full bg-amber-400" title="Syncing..."></span>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="forceSync()" class="text-xs font-semibold text-rose-600 bg-rose-50 px-3 py-1.5 rounded-full active:scale-95 transition">Sync Now</button>
            <button onclick="logout()" class="text-xs font-semibold text-gray-500 bg-gray-200/60 px-3 py-1.5 rounded-full active:scale-95 transition">Logout</button>
            <button onclick="openSettings()" class="w-8 h-8 rounded-full bg-gray-200/60 flex items-center justify-center text-gray-700 active:scale-95 transition">
                <i data-lucide="settings" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <main class="flex-1 max-w-md w-full mx-auto px-4 pt-4 space-y-4">
        
        <!-- Child Profile Selector Tabs -->
        <div id="childSelector" class="flex gap-2 overflow-x-auto pb-1 no-scrollbar"></div>

        <!-- Dashboard Card -->
        <div id="summaryCardContainer" class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 hidden">
            <div class="flex justify-between items-center mb-3">
                <div class="flex items-center gap-1.5 text-rose-500 font-semibold text-sm">
                    <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
                    <span>Dashboard (Past 24h)</span>
                </div>
            </div>
            <div class="grid grid-cols-3 gap-2 text-center">
                <div onclick="openSummaryDetail('formula')" class="bg-blue-50/60 rounded-xl p-2.5 active:scale-95 transition cursor-pointer hover:bg-blue-100/60">
                    <i data-lucide="droplet" class="w-4 h-4 text-blue-500 mx-auto mb-1"></i>
                    <div id="summaryFormula" class="font-bold text-sm text-gray-800">0.0 oz</div>
                    <div class="text-[10px] text-gray-500 font-medium">Formula</div>
                </div>
                <div onclick="openSleepCalendarModal()" class="bg-purple-50/60 rounded-xl p-2.5 active:scale-95 transition cursor-pointer hover:bg-purple-100/60 relative group">
                    <div class="absolute -top-1 -right-1 bg-purple-500 text-white rounded-full p-0.5 shadow-xs">
                        <i data-lucide="calendar" class="w-2.5 h-2.5"></i>
                    </div>
                    <i data-lucide="moon" class="w-4 h-4 text-purple-500 mx-auto mb-1"></i>
                    <div id="summarySleep" class="font-bold text-sm text-gray-800">0.0h</div>
                    <div class="text-[10px] text-purple-600 font-semibold flex items-center justify-center gap-0.5">
                        Sleep <i data-lucide="chevron-right" class="w-2.5 h-2.5"></i>
                    </div>
                </div>
                <div onclick="openSummaryDetail('diaper')" class="bg-orange-50/60 rounded-xl p-2.5 active:scale-95 transition cursor-pointer hover:bg-orange-100/60">
                    <i data-lucide="layers" class="w-4 h-4 text-orange-400 mx-auto mb-1"></i>
                    <div id="summaryDiapers" class="font-bold text-sm text-gray-800">0W / 0D</div>
                    <div class="text-[10px] text-gray-500 font-medium">Diapers</div>
                </div>
            </div>
        </div>

        <!-- Dynamic Action Buttons Grid -->
        <div id="actionGrid" class="grid grid-cols-2 gap-3"></div>

        <!-- Instant Diaper Log Chips -->
        <div id="instantDiaperSection" class="space-y-1.5">
            <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider px-1">Instant Diaper Log</span>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="quickDiaper('Wet')" class="bg-blue-50 text-blue-600 font-semibold text-xs py-2.5 rounded-full flex items-center justify-center gap-1 active:scale-95 transition shadow-xs">
                    <i data-lucide="droplet" class="w-3.5 h-3.5"></i> Wet
                </button>
                <button onclick="quickDiaper('Dirty')" class="bg-amber-50 text-amber-700 font-semibold text-xs py-2.5 rounded-full flex items-center justify-center gap-1 active:scale-95 transition shadow-xs">
                    <i data-lucide="circle" class="w-3.5 h-3.5"></i> Dirty
                </button>
                <button onclick="quickDiaper('Both')" class="bg-purple-50 text-purple-600 font-semibold text-xs py-2.5 rounded-full flex items-center justify-center gap-1 active:scale-95 transition shadow-xs">
                    <i data-lucide="sparkles" class="w-3.5 h-3.5"></i> Both
                </button>
            </div>
        </div>

        <!-- Recent Logs Feed with Filter & Sort Panel -->
        <div class="space-y-2 pt-2">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-sm font-bold text-gray-800">Logs Feed</h2>
                <button onclick="toggleFilterPanel()" class="text-xs font-semibold text-rose-500 flex items-center gap-1 bg-rose-50 px-2.5 py-1 rounded-full active:scale-95 transition">
                    <i data-lucide="filter" class="w-3 h-3"></i> Filter & Sort
                </button>
            </div>

            <!-- Collapsible Filter Panel -->
            <div id="filterPanel" class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 space-y-3 hidden">
                <div>
                    <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Filter by Type</label>
                    <div id="logTypeFilters" class="flex gap-1.5 overflow-x-auto py-1.5 no-scrollbar"></div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">From Date</label>
                        <input type="date" id="filterDateStart" onchange="updateLogFilters()" class="w-full mt-1 bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs font-medium text-gray-700">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">To Date</label>
                        <input type="date" id="filterDateEnd" onchange="updateLogFilters()" class="w-full mt-1 bg-gray-50 border border-gray-200 rounded-xl p-2 text-xs font-medium text-gray-700">
                    </div>
                </div>
                <div class="flex justify-between items-center pt-1 border-t border-gray-100">
                    <button onclick="resetFilters()" class="text-xs font-semibold text-gray-500 hover:text-gray-700">Reset Filters</button>
                    <span id="activeFilterCount" class="text-[10px] font-bold text-rose-500"></span>
                </div>
            </div>

            <div id="logsContainer" class="space-y-2"></div>
        </div>
    </main>

    <!-- Generic Centered Modal Popup -->
    <div id="appModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 hidden flex items-center justify-center p-4 transition-opacity">
        <div id="modalBox" class="bg-[#f2f2f7] w-full max-w-md mx-auto rounded-3xl max-h-[90vh] overflow-y-auto p-5 space-y-4 shadow-xl">
            <div class="flex justify-between items-center border-b border-gray-200 pb-3">
                <h3 id="modalTitle" class="font-bold text-lg text-gray-900">Log Entry</h3>
                <button onclick="closeModal()" class="text-gray-400 font-semibold text-sm">Cancel</button>
            </div>
            <div id="modalBody" class="space-y-4"></div>
        </div>
    </div>

    <!-- Application JavaScript Logic -->
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzQXwiSr4NpYe4sV0gdrhiGmbBskpXWkAzF0Zi2riS-UxuVjqgAI1_IydbLi3PovPk/exec";

        let currentUser = localStorage.getItem('babyTrackerCurrentUser') || '';
        let state = {
            children: [{ id: '1', name: 'Baby', birthdate: '', showNursing: true, showBottle: true, showDiaper: true, showSleep: true, activeSleepStart: null, lastConfettiTime: null }],
            selectedChildId: null,
            logs: [],
            lastModified: 0
        };

        let filterType = 'all';
        let filterStartDate = '';
        let filterEndDate = '';

        window.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            if (currentUser) {
                document.getElementById('loginScreen').classList.add('hidden');
                loadData(true);
            } else {
                document.getElementById('loginScreen').classList.remove('hidden');
            }
        });

        function handleLogin() {
            const usernameInput = document.getElementById('loginUser').value.trim().toLowerCase();
            if (!usernameInput) {
                alert("Please enter a username.");
                return;
            }
            currentUser = usernameInput;
            localStorage.setItem('babyTrackerCurrentUser', currentUser);
            document.getElementById('loginScreen').classList.add('hidden');
            loadData(true);
        }

        function logout() {
            localStorage.removeItem('babyTrackerCurrentUser');
            currentUser = '';
            document.getElementById('loginUser').value = '';
            document.getElementById('childSelectScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        }

        function getStorageKey() {
            return `babyTrackerState_${currentUser || 'default'}`;
        }

        function mergeStates(local, cloud) {
            if (!cloud) return local;
            if (!local) return cloud;

            // Merge log arrays by unique ID to prevent data loss across multi-device usage
            const map = new Map();
            if (local.logs) local.logs.forEach(l => map.set(l.id, l));
            if (cloud.logs) cloud.logs.forEach(l => {
                // If local has un-synced additions or cloud has newer, keep both safely
                map.set(l.id, l);
            });

            return {
                children: cloud.children || local.children,
                selectedChildId: local.selectedChildId !== undefined ? local.selectedChildId : cloud.selectedChildId,
                logs: Array.from(map.values()),
                lastModified: Math.max(local.lastModified || 0, cloud.lastModified || 0)
            };
        }

        async function loadData(promptChildSelect = false) {
            const statusDot = document.getElementById('syncStatus');
            const storageKey = getStorageKey();
            
            // 1. Load immediately from local device storage
            const localRaw = localStorage.getItem(storageKey);
            let localState = null;
            if (localRaw) {
                try { localState = JSON.parse(localRaw); } catch(e) {}
            }

            if (localState) {
                state = localState;
                render();
                checkBirthdayCelebration();
                if (promptChildSelect) showChildSelectPrompt();
            }

            // 2. Fetch authoritative state from Google Cloud script backend
            try {
                statusDot.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";
                statusDot.title = "Syncing with cloud...";

                const response = await fetch(`${SCRIPT_URL}?user=${encodeURIComponent(currentUser)}`, { method: 'GET', cache: 'no-store' });
                const cloudData = await response.json();
                
                if (cloudData && Array.isArray(cloudData.logs)) {
                    // Fail-safe merge ensures no logs get erased across device mismatches
                    state = mergeStates(state, cloudData);
                    localStorage.setItem(storageKey, JSON.stringify(state));
                    render();
                    checkBirthdayCelebration();
                    if (promptChildSelect) showChildSelectPrompt();
                }
                
                statusDot.className = "w-2 h-2 rounded-full bg-emerald-500";
                statusDot.title = "Synced with Google Sheet";
            } catch (err) {
                statusDot.className = "w-2 h-2 rounded-full bg-amber-400";
                statusDot.title = "Offline Mode (Using Local Device Data)";
                if (promptChildSelect) showChildSelectPrompt();
            }
        }

        async function forceSync() {
            await loadData(false);
            await saveData();
        }

        function showChildSelectPrompt() {
            const screen = document.getElementById('childSelectScreen');
            const container = document.getElementById('loginChildOptions');
            let html = '';
            
            state.children.forEach(child => {
                html += `<button onclick="selectChildAndDismiss('${child.id}')" class="w-full bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold py-3 rounded-xl transition text-sm flex items-center justify-center gap-2"><i data-lucide="baby" class="w-4 h-4"></i> ${child.name}</button>`;
            });
            container.innerHTML = html;
            screen.classList.remove('hidden');
            lucide.createIcons();
        }

        function selectChildAndDismiss(id) {
            state.selectedChildId = id;
            document.getElementById('childSelectScreen').classList.add('hidden');
            saveData();
        }

        function proceedToAllChildren() {
            state.selectedChildId = null;
            document.getElementById('childSelectScreen').classList.add('hidden');
            saveData();
        }

        async function saveData() {
            const statusDot = document.getElementById('syncStatus');
            const storageKey = getStorageKey();
            
            statusDot.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";
            statusDot.title = "Saving...";

            state.lastModified = Date.now();
            localStorage.setItem(storageKey, JSON.stringify(state));
            render();

            try {
                const payload = { user: currentUser, data: state };
                const res = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight failures on Apps Script redirects
                    body: JSON.stringify(payload)
                });
                statusDot.className = "w-2 h-2 rounded-full bg-emerald-500";
                statusDot.title = "Synced with Google Sheet";
            } catch (err) {
                statusDot.className = "w-2 h-2 rounded-full bg-amber-400";
                statusDot.title = "Saved Locally (Cloud Sync Failed)";
            }
        }

        setInterval(() => {
            const child = getActiveChild();
            if (child && child.activeSleepStart) {
                const elapsed = Math.floor((Date.now() - child.activeSleepStart) / 1000);
                const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
                const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
                const s = String(elapsed % 60).padStart(2, '0');
                const minDisplay = document.getElementById('minimizedSleepDisplay');
                if (minDisplay) minDisplay.innerText = `${h}:${m}:${s}`;
            }
        }, 1000);

        function formatDuration(ms) {
            const totalMins = Math.round(ms / 60000);
            const h = Math.floor(totalMins / 60);
            const m = totalMins % 60;
            if (h > 0) return `${h}h ${m}m`;
            return `${m}m`;
        }

        function formatTime(timestamp) {
            return new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        function render() {
            renderChildSelector();
            renderSummary();
            renderActionGrid();
            renderFilterPanel();
            renderLogs();
            lucide.createIcons();
        }

        function renderChildSelector() {
            const container = document.getElementById('childSelector');
            let html = `<button onclick="selectChild(null)" class="px-4 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap ${state.selectedChildId === null ? 'bg-rose-500 text-white' : 'bg-white text-gray-700 shadow-xs'}">All Children</button>`;
            
            state.children.forEach(child => {
                const isSelected = state.selectedChildId === child.id;
                html += `<button onclick="selectChild('${child.id}')" class="px-4 py-1.5 rounded-full text-xs font-bold transition whitespace-nowrap ${isSelected ? 'bg-rose-500 text-white' : 'bg-white text-gray-700 shadow-xs'}">${child.name}</button>`;
            });
            container.innerHTML = html;
        }

        function selectChild(id) {
            state.selectedChildId = id;
            saveData();
            checkBirthdayCelebration();
        }

        function checkBirthdayCelebration() {
            const child = getActiveChild();
            if (!child || !child.birthdate) return;

            const today = new Date();
            const [bYear, bMonth, bDay] = child.birthdate.split('-').map(Number);

            if (today.getMonth() + 1 === bMonth && today.getDate() === bDay) {
                const oneHour = 3600000;
                if (!child.lastConfettiTime || (Date.now() - child.lastConfettiTime > oneHour)) {
                    confetti({ particleCount: 120, spread: 80, origin: { y: 0.3 } });
                    child.lastConfettiTime = Date.now();
                    saveData();
                }
            }
        }

        function getActiveChild() {
            return state.children.find(c => c.id === state.selectedChildId) || state.children[0];
        }

        function filteredLogs() {
            let logs = state.logs || [];
            if (state.selectedChildId) {
                logs = logs.filter(l => l.childId === state.selectedChildId);
            }
            if (filterType !== 'all') {
                logs = logs.filter(l => l.type === filterType);
            }
            if (filterStartDate) {
                const startMs = new Date(filterStartDate + 'T00:00:00').getTime();
                logs = logs.filter(l => l.startTime >= startMs);
            }
            if (filterEndDate) {
                const endMs = new Date(filterEndDate + 'T23:59:59').getTime();
                logs = logs.filter(l => l.startTime <= endMs);
            }
            return logs;
        }

        function renderSummary() {
            const logs = (state.logs || []).filter(l => !state.selectedChildId || l.childId === state.selectedChildId);
            const weekCutoff = Date.now() - (7 * 86400000);
            const weekLogs = logs.filter(l => l.startTime >= weekCutoff);
            
            const summaryContainer = document.getElementById('summaryCardContainer');
            
            if (weekLogs.length === 0) {
                summaryContainer.classList.add('hidden');
                return;
            } else {
                summaryContainer.classList.remove('hidden');
            }

            const dayCutoff = Date.now() - 86400000;
            const recent = logs.filter(l => l.startTime >= dayCutoff);

            const formula = recent.filter(l => l.type === 'bottle').reduce((acc, l) => acc + (l.amount || 0), 0);
            const wet = recent.filter(l => l.type === 'diaper' && (l.diaperType === 'Wet' || l.diaperType === 'Both')).length;
            const dirty = recent.filter(l => l.type === 'diaper' && (l.diaperType === 'Dirty' || l.diaperType === 'Both')).length;
            
            let totalSleepMs = 0;
            recent.filter(l => l.type === 'sleep').forEach(l => {
                const lStart = l.startTime;
                const lEnd = l.endTime || Date.now();
                const effectiveStart = Math.max(lStart, dayCutoff);
                const effectiveEnd = Math.min(lEnd, Date.now());
                if (effectiveEnd > effectiveStart) {
                    totalSleepMs += (effectiveEnd - effectiveStart);
                }
            });

            document.getElementById('summaryFormula').innerText = formula.toFixed(1) + ' oz';
            document.getElementById('summarySleep').innerText = (totalSleepMs / 3600000).toFixed(1) + 'h';
            document.getElementById('summaryDiapers').innerText = `${wet}W / ${dirty}D`;
        }

        function renderActionGrid() {
            const child = getActiveChild();
            const grid = document.getElementById('actionGrid');
            const diaperSection = document.getElementById('instantDiaperSection');
            
            if(!child) return;
            if(!child.showDiaper) diaperSection.classList.add('hidden'); else diaperSection.classList.remove('hidden');

            let html = '';
            if(child.showNursing) {
                html += `
                    <button onclick="openNursingTimer()" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2 active:scale-95 transition">
                        <div class="w-10 h-10 rounded-full bg-rose-50 text-rose-500 flex items-center justify-center"><i data-lucide="timer" class="w-5 h-5"></i></div>
                        <span class="text-xs font-bold text-gray-800">Nursing Timer</span>
                    </button>
                `;
            }
            if(child.showSleep) {
                if(child.activeSleepStart) {
                    const elapsed = Math.floor((Date.now() - child.activeSleepStart) / 1000);
                    const h = String(Math.floor(elapsed / 3600)).padStart(2, '0');
                    const m = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
                    const s = String(elapsed % 60).padStart(2, '0');
                    html += `
                        <button onclick="openSleepTimer()" class="bg-purple-50 border border-purple-200 p-4 rounded-2xl shadow-sm flex flex-col items-center justify-center gap-1 active:scale-95 transition">
                            <div class="w-10 h-10 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center"><i data-lucide="moon-star" class="w-5 h-5 animate-pulse"></i></div>
                            <span id="minimizedSleepDisplay" class="text-xs font-mono font-bold text-purple-900">${h}:${m}:${s}</span>
                        </button>
                    `;
                } else {
                    html += `
                        <button onclick="openSleepTimer()" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2 active:scale-95 transition">
                            <div class="w-10 h-10 rounded-full bg-purple-50 text-purple-500 flex items-center justify-center"><i data-lucide="moon-star" class="w-5 h-5"></i></div>
                            <span class="text-xs font-bold text-gray-800">Sleep Timer</span>
                        </button>
                    `;
                }
            }
            if(child.showBottle) {
                html += `
                    <button onclick="openManualModal('bottle')" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center gap-2 active:scale-95 transition">
                        <div class="w-10 h-10 rounded-full bg-blue-50 text-blue-500 flex items-center justify-center"><i data-lucide="droplet" class="w-5 h-5"></i></div>

        function renderLogs() {
            const container = document.getElementById('logsContainer');
            const logs = filteredLogs();

            if (logs.length === 0) {
                container.innerHTML = `<div class="text-center py-8 text-gray-400 text-xs bg-white rounded-2xl border border-gray-100">No matching logs found.</div>`;
                return;
            }

            let html = '';
            logs.sort((a,b) => b.startTime - a.startTime).forEach(log => {
                const childObj = state.children.find(c => c.id === log.childId);
                const timeStr = new Date(log.startTime).toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + formatTime(log.startTime);
                
                let icon = 'droplet', color = 'bg-blue-500', detail = '';
                if(log.type === 'nursing') { icon = 'heart'; color = 'bg-rose-500'; detail = `Side: ${log.side || 'Left'} (${formatDuration(((log.endTime || log.startTime) - log.startTime))})`; }
                if(log.type === 'sleep') { 
                    icon = 'moon'; 
                    color = 'bg-purple-500'; 
                    const duration = log.endTime ? formatDuration(log.endTime - log.startTime) : 'In Progress';
                    const timeRange = log.endTime ? `${formatTime(log.startTime)} – ${formatTime(log.endTime)}` : `${formatTime(log.startTime)} (Ongoing)`;
                    detail = `${timeRange} • ${duration}`; 
                }
                if(log.type === 'bottle') { icon = 'droplet'; color = 'bg-blue-500'; detail = `${log.amount} oz`; }
                if(log.type === 'diaper') { icon = 'layers'; color = 'bg-orange-400'; detail = `Type: ${log.diaperType}`; }

                html += `
                    <div onclick="openEditModal('${log.id}')" class="bg-white p-3.5 rounded-2xl shadow-sm border border-gray-100 flex items-center justify-between active:scale-98 transition cursor-pointer">
                        <div class="flex items-center gap-3">

                                <div class="text-sm font-bold text-gray-800 capitalize">${log.type} ${childObj && state.selectedChildId === null ? '• ' + childObj.name : ''}</div>

                            </div>
                        </div>

                    </div>
                `;
            });
            container.innerHTML = html;

        // --- Weekly Sleep Calendar View ---
        function openSleepCalendarModal() {
            const modal = document.getElementById('appModal');
            const modalBox = document.getElementById('modalBox');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            
            modal.classList.remove('hidden');
            modalBox.className = "bg-white w-full max-w-4xl mx-auto rounded-3xl max-h-[92vh] overflow-y-auto p-4 space-y-3 shadow-xl";
            title.innerText = "Weekly Sleep Calendar (Sun - Sat)";

            const now = new Date();
            const currentDayOfWeek = now.getDay();
            const sunday = new Date(now);
            sunday.setDate(now.getDate() - currentDayOfWeek);
            sunday.setHours(0, 0, 0, 0);

            const weekDays = [];
            for(let i=0; i<7; i++) {
                const d = new Date(sunday);
                d.setDate(sunday.getDate() + i);
                weekDays.push(d);
            }

            const sleepLogs = (state.logs || []).filter(l => (state.selectedChildId === null || l.childId === state.selectedChildId) && l.type === 'sleep');

            let headerHtml = `<div class="grid grid-cols-8 border-b border-gray-200 pb-2 text-center font-bold text-xs text-gray-500 sticky top-0 bg-white z-20"><div>Time</div>`;
            const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            weekDays.forEach((d, idx) => {
                const dateNum = `${d.getMonth()+1}/${d.getDate()}`;
                headerHtml += `<div><div>${dayNames[idx]}</div><div class="text-[10px] text-gray-400 font-normal">${dateNum}</div></div>`;
            });
            headerHtml += `</div>`;

            const HOUR_HEIGHT = 36;
            const TOTAL_HEIGHT = HOUR_HEIGHT * 24;

            let timeLabelsHtml = `<div class="w-16 shrink-0 flex flex-col border-r border-gray-200 bg-gray-50/50">`;
            for(let hour = 0; hour < 24; hour++) {
                const hourLabel = hour === 0 ? '12 AM' : hour < 12 ? `${hour} AM` : hour === 12 ? '12 PM' : `${hour - 12} PM`;
                timeLabelsHtml += `<div class="text-[10px] text-gray-400 font-medium text-right pr-2 select-none flex items-center justify-end" style="height: ${HOUR_HEIGHT}px;">${hourLabel}</div>`;
            }
            timeLabelsHtml += `</div>`;

            let gridLinesHtml = `<div class="absolute inset-0 pointer-events-none flex flex-col">`;
            for(let hour = 0; hour < 24; hour++) {
                gridLinesHtml += `<div class="border-b border-gray-100 w-full" style="height: ${HOUR_HEIGHT}px;"></div>`;
            }
            gridLinesHtml += `</div>`;

            let columnsHtml = `<div class="grid grid-cols-7 flex-1 relative bg-white">`;

            weekDays.forEach(day => {
                const dayStart = day.getTime();
                const dayEnd = dayStart + 86400000;

                const dayLogs = sleepLogs.filter(l => {
                    const lStart = l.startTime;
                    const lEnd = l.endTime || Date.now();
                    return lStart < dayEnd && lEnd > dayStart;
                });

                columnsHtml += `<div class="relative border-r border-gray-100" style="height: ${TOTAL_HEIGHT}px;">`;

                dayLogs.forEach(l => {
                    const lStart = l.startTime;
                    const lEnd = l.endTime || Date.now();

                    const effectiveStart = Math.max(lStart, dayStart);
                    const effectiveEnd = Math.min(lEnd, dayEnd);

                    const startMin = (effectiveStart - dayStart) / 60000;
                    const durationMin = (effectiveEnd - effectiveStart) / 60000;

                    const topPx = (startMin / 1440) * TOTAL_HEIGHT;
                    const heightPx = Math.max(18, (durationMin / 1440) * TOTAL_HEIGHT);
                    const timeStr = `${formatTime(l.startTime)} - ${l.endTime ? formatTime(l.endTime) : 'Ongoing'}`;

                    columnsHtml += `
                        <div onclick="openEditModal('${l.id}')" title="${timeStr}" 
                             class="absolute left-1 right-1 bg-purple-500 hover:bg-purple-600 text-white rounded-lg px-1.5 py-0.5 overflow-hidden cursor-pointer shadow-xs transition text-[10px] font-semibold flex flex-col justify-start z-10"
                             style="top: ${topPx}px; height: ${heightPx}px;">
                            <div class="truncate">${formatTime(l.startTime)}</div>
                            ${heightPx > 35 ? `<div class="text-[9px] font-normal opacity-90 truncate">${formatDuration(effectiveEnd - effectiveStart)}</div>` : ''}
                        </div>
                    `;
                });

                columnsHtml += `</div>`;
            });
            columnsHtml += `</div>`;

            body.innerHTML = `
                <div class="space-y-2">
                    <div class="text-[11px] text-gray-500 text-center">Tap any sleep block to inspect or edit.</div>
                    <div class="border border-gray-200 rounded-2xl bg-white overflow-hidden shadow-sm">
                        ${headerHtml}
                        <div class="flex overflow-y-auto max-h-[60vh] relative">
                            ${gridLinesHtml}
                            ${timeLabelsHtml}
                            ${columnsHtml}
                        </div>
                    </div>
                </div>
                <button onclick="closeModal()" class="w-full bg-purple-600 text-white font-bold py-2.5 rounded-xl shadow-sm text-xs">Done</button>
            `;
            lucide.createIcons();
        }

                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Diaper Status</label>
                        <select id="editDiaperType" class="w-full mt-1 bg-white border border-gray-200 rounded-xl p-3 text-base font-semibold">
                            <option value="Wet" ${log.diaperType === 'Wet' ? 'selected' : ''}>Wet</option>
                            <option value="Dirty" ${log.diaperType === 'Dirty' ? 'selected' : ''}>Dirty</option>
                            <option value="Both" ${log.diaperType === 'Both' ? 'selected' : ''}>Both</option>
                        </select>
                    </div>
                `;
            } else if (log.type === 'nursing') {
                const durationMins = Math.round(((log.endTime || log.startTime) - log.startTime) / 60000);
                specificFieldsHtml = `
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Side</label>
                        <select id="editNursingSide" class="w-full mt-1 bg-white border border-gray-200 rounded-xl p-3 text-base font-semibold">
                            <option value="Left" ${log.side === 'Left' ? 'selected' : ''}>Left Side</option>
                            <option value="Right" ${log.side === 'Right' ? 'selected' : ''}>Right Side</option>
                            <option value="Both" ${log.side === 'Both' ? 'selected' : ''}>Both Sides</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Duration (Minutes)</label>
                        <input id="editNursingDuration" type="number" step="1" value="${durationMins}" class="w-full mt-1 bg-white border border-gray-200 rounded-xl p-3 text-base font-semibold">
                    </div>
                `;
            } else if (log.type === 'sleep') {
                const startIso = new Date(log.startTime - (new Date()).getTimezoneOffset() * 60000).toISOString().slice(0, 16);
                const endIso = log.endTime ? new Date(log.endTime - (new Date()).getTimezoneOffset() * 60000).toISOString().slice(0, 16) : '';
                specificFieldsHtml = `
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Start Time</label>
                        <input id="editSleepStart" type="datetime-local" value="${startIso}" class="w-full mt-1 bg-white border border-gray-200 rounded-xl p-3 text-base font-semibold">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">End Time</label>
                        <input id="editSleepEnd" type="datetime-local" value="${endIso}" class="w-full mt-1 bg-white border border-gray-200 rounded-xl p-3 text-base font-semibold">
                    </div>
                `;
            }

            body.innerHTML = `
                ${specificFieldsHtml}
                <div>
                    <label class="text-xs font-bold text-gray-500 uppercase tracking-wider">Notes</label>
                    <input id="editNotes" type="text" value="${log.notes || ''}" class="w-full mt-1 bg-white border border-gray-200 rounded-xl p-3 text-base">
                </div>
                <button onclick="updateLog('${log.id}')" class="w-full bg-rose-500 text-white font-bold py-3 rounded-xl shadow-sm">Save Changes</button>
                <button onclick="deleteLog('${log.id}')" class="w-full bg-red-100 text-red-600 font-bold py-3 rounded-xl">Delete Log</button>
            `;
        }

        function updateLog(logId) {
            const log = (state.logs || []).find(l => l.id === logId);
            if(!log) return;

            log.notes = document.getElementById('editNotes')?.value || '';

            if (log.type === 'bottle') {
                const parsedAmount = parseFloat(document.getElementById('editBottleAmount').value);
                log.amount = parsedAmount >= 0 ? parsedAmount : 0;
            } else if (log.type === 'diaper') {
                log.diaperType = document.getElementById('editDiaperType').value;
            } else if (log.type === 'nursing') {
                log.side = document.getElementById('editNursingSide').value;
                const mins = parseFloat(document.getElementById('editNursingDuration').value) || 0;
                log.endTime = log.startTime + (mins * 60000);
            } else if (log.type === 'sleep') {
                const startVal = document.getElementById('editSleepStart').value;
                const endVal = document.getElementById('editSleepEnd').value;
                if(startVal) log.startTime = new Date(startVal).getTime();
                if(endVal) log.endTime = new Date(endVal).getTime();
                else log.endTime = null;
            }

            closeModal();
            saveData();
        }

        function deleteLog(logId) {
            state.logs = (state.logs || []).filter(l => l.id !== logId);
            closeModal();
            saveData();
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `baby_tracker_${currentUser}_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedState = JSON.parse(e.target.result);
                    if (importedState && importedState.children && importedState.logs) {
                        state = importedState;
                        saveData();
                        alert("Data successfully imported!");
                        closeModal();
                    } else {
                        alert("Invalid backup file format.");
                    }
                } catch (err) {
                    alert("Error parsing JSON file.");
                }
            };
            reader.readAsText(file);
        }

        function openSettings() {
            const modal = document.getElementById('appModal');
            const modalBox = document.getElementById('modalBox');
            const title = document.getElementById('modalTitle');
            const body = document.getElementById('modalBody');
            modal.classList.remove('hidden');
            modalBox.className = "bg-[#f2f2f7] w-full max-w-md mx-auto rounded-3xl max-h-[90vh] overflow-y-auto p-5 space-y-4 shadow-xl";
            title.innerText = `Settings (${currentUser})`;

            let childrenHtml = '';
            state.children.forEach(c => {
                childrenHtml += `
                    <div class="bg-white p-3 rounded-xl space-y-2 border border-gray-100">
                        <input type="text" value="${c.name}" onchange="updateChildName('${c.id}', this.value)" class="w-full font-bold bg-gray-50 border border-gray-200 rounded-lg p-2 text-sm">
                        <div>
                            <label class="text-[10px] font-bold text-gray-400 uppercase">Birthdate</label>
                            <input type="date" value="${c.birthdate || ''}" onchange="updateChildBirthdate('${c.id}', this.value)" class="w-full mt-0.5 bg-gray-50 border border-gray-200 rounded-lg p-2 text-xs font-medium text-gray-700">
                        </div>
                        <div class="grid grid-cols-2 gap-2 text-xs font-medium text-gray-600 pt-1">
                            <label><input type="checkbox" ${c.showNursing ? 'checked' : ''} onchange="toggleChildFeature('${c.id}', 'showNursing', this.checked)"> Nursing</label>
                            <label><input type="checkbox" ${c.showBottle ? 'checked' : ''} onchange="toggleChildFeature('${c.id}', 'showBottle', this.checked)"> Bottle</label>
                            <label><input type="checkbox" ${c.showDiaper ? 'checked' : ''} onchange="toggleChildFeature('${c.id}', 'showDiaper', this.checked)"> Diaper</label>
                            <label><input type="checkbox" ${c.showSleep ? 'checked' : ''} onchange="toggleChildFeature('${c.id}', 'showSleep', this.checked)"> Sleep</label>
                        </div>
                    </div>
                `;
            });

            body.innerHTML = `
                <div class="space-y-3">
                    <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Child Profiles</h4>
                    ${childrenHtml}
                    <button onclick="addChildProfile()" class="w-full bg-gray-200 text-gray-800 font-bold py-2.5 rounded-xl text-sm">+ Add Child Profile</button>
                    
                    <div class="bg-white p-3 rounded-xl space-y-2 border border-gray-100 mt-4">
                        <h4 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Backup & Export (${currentUser})</h4>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="exportData()" class="bg-gray-100 text-gray-800 font-bold py-2.5 rounded-xl text-xs active:scale-95 transition">Export JSON</button>
                            <label class="bg-gray-100 text-gray-800 font-bold py-2.5 rounded-xl text-xs active:scale-95 transition text-center cursor-pointer flex items-center justify-center">
                                Import JSON
                                <input type="file" accept=".json" onchange="importData(event)" class="hidden">
                            </label>
                        </div>
                    </div>

                    <button onclick="closeModal()" class="w-full bg-rose-500 text-white font-bold py-3 rounded-xl mt-4">Done</button>
                </div>
            `;
            lucide.createIcons();
        }

        function updateChildName(id, name) {
            const c = state.children.find(ch => ch.id === id);
            if(c) { c.name = name; saveData(); }
        }

        function updateChildBirthdate(id, birthdate) {
            const c = state.children.find(ch => ch.id === id);
            if(c) { c.birthdate = birthdate; saveData(); }
        }

        function toggleChildFeature(id, feature, val) {
            const c = state.children.find(ch => ch.id === id);
            if(c) { c[feature] = val; saveData(); }
        }

        function addChildProfile() {
            const name = prompt("Enter child name:", "Baby");
            if(name) {
                state.children.push({
                    id: Date.now().toString() + Math.random().toString(36).substring(2,5),
                    name: name,
                    birthdate: '',
                    showNursing: true,
                    showBottle: true,
                    showDiaper: true,
                    showSleep: true,
                    activeSleepStart: null,
                    lastConfettiTime: null
                });
                saveData();
                openSettings();
            }
        }

        function closeModal() {
            document.getElementById('appModal').classList.add('hidden');
        }
    </script>
</body>
</html>
